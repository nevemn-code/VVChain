const $=s=>document.querySelector(s);let audioCtx=null,audioBuffer=null,source=null,workletNode=null,workletModuleUrl=null,playing=false;
const eqCanvas=$("#eqCanvas"),eqCtx=eqCanvas.getContext("2d"),graphHint=$("#graphHint");
const state={masterBypass:false,solo:{band:-1,post:false},bandBypass:[false,false,false,false],eq:{bypass:false,globalBypass:false,freq:[80,350,2500,10000],gain:[0,0,0,0],q:[.707,.707,.707,.707],color:[35,35,35,35],colorBypass:[false,false,false,false],mode:[false,false,false,false]},dyn:{bypass:false,threshold:[-24,-24,-24,-24],target:[3,3,2,2],dynamics:[0,0,0,0],attack:[8,8,5,3],release:[120,120,100,80],detectOnsets:[false,false,false,false],triggerBelow:[false,false,false,false],ms:[50,50,50,50],gainMid:[0,0,0,0],gainSide:[0,0,0,0]},ott:{bypass:false,bandBypass:[false,false,false,false],degree:[25,25,22,18],liftT:[-35,-35,-35,-35],liftA:[1,1,1,1],liftR:[80,80,80,80],liftM:[70,70,60,50],compT:[-24,-24,-24,-24],compA:[15,8,3,1],compR:[50,50,50,50],compM:[85,85,85,85],level:[0,0,0,0],x:[90,2500,7000],overlap:[50,50,50],input:0,gate:-80,mix:25,clip:false,output:0},type:{bypass:false,bandBypass:[false,false,false,false],degree:[6,12,28,22],level:[0,0,1,1],attack:1,release:20,input:0,mix:100,output:0},de:{bypass:false,freq:8000,intensity:3,offset:0},mix:{bypass:false,drywet:100,output:0}};
const defaults=structuredClone(state),knobRefreshers=[],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=(v,d=1)=>Number(v).toFixed(d),logX=(hz,w)=>Math.log10(clamp(hz,20,20000)/20)/3*w,invLog=x=>20*Math.pow(1000,clamp(x,0,1));
const WORKLET_SOURCE=`class VVChainWorklet extends AudioWorkletProcessor {\n  constructor(){\n    super();\n    this.ready=false; this.s=null;\n    this.N=512;\n    this.masterBlend=0;\n    this.soloBlend=0;\n    this._lastSoloBand=-9;\n    this._lastSoloPost=false;\n    this._meterBlocks=0;\n    this.ch=[this.makeCh(),this.makeCh()];\n    this.port.onmessage=e=>{\n      if(e.data&&e.data.type===\"params\"){\n        const next=e.data.state;\n        if(this.s&&(\n          Number(this.s.solo?.band??-1)!==Number(next.solo?.band??-1) ||\n          !!this.s.solo?.post!==!!next.solo?.post))\n          this.soloBlend=0;\n        this.s=next;\n        this.ready=true;\n      }\n    };\n  }\n  makeCh(){\n    const dynState=()=>({det:{z1:0,z2:0},eq:{z1:0,z2:0},env:-120});\n    return {\n      eq:Array.from({length:4},()=>({z1:0,z2:0})),\n      dynMid:Array.from({length:4},dynState),\n      dynSide:Array.from({length:4},dynState),\n      analogPrev:[0,0,0,0], analogDc:[0,0,0,0], analogPower:[0,0,0,0],\n      lp:[0,0,0], typeLp:[0,0,0], gate:0, gateBand:[0,0,0,0], lim:0,\n      lift:[1,1,1,1], comp:[0,0,0,0], typeFast:[0,0,0,0], typeSlow:[0,0,0,0], typeDc:[0,0,0,0],\n      deHp:{z1:0,z2:0}, deHp2:{z1:0,z2:0}, deFast:0, deSlow:0, deGain:0, soloPre:[0,0,0], soloPost:[0,0,0]\n    };\n  }\n  clamp(v,a,b){return Math.max(a,Math.min(b,v))}\n  finite(v){return Number.isFinite(v)?v:0}\n  db2g(db){return Math.pow(10,db/20)}\n  g2db(g){return 20*Math.log10(Math.max(g,1e-9))}\n  tc(ms){return Math.exp(-1/(.001*Math.max(.1,ms)*sampleRate))}\n  biquad(x,c,z){const y=c[0]*x+z.z1;z.z1=c[1]*x-c[3]*y+z.z2;z.z2=c[2]*x-c[4]*y;return y}\n  peak(fs,f,q,g){\n    const A=Math.pow(10,g/40),w=2*Math.PI*this.clamp(f,10,fs*.45)/fs;\n    const a=Math.sin(w)/(2*Math.max(.1,q)),cc=Math.cos(w);\n    const b0=1+a*A,b1=-2*cc,b2=1-a*A,a0=1+a/A,a1=-2*cc,a2=1-a/A;\n    return[b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]\n  }\n  bp(f,q=.707){\n    const w=2*Math.PI*this.clamp(f,10,sampleRate*.45)/sampleRate;\n    const sn=Math.sin(w),cc=Math.cos(w),a=sn/(2*Math.max(.1,q));\n    const b0=sn/2,b1=0,b2=-sn/2,a0=1+a,a1=-2*cc,a2=1-a;\n    return[b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]\n  }\n  hp(f,q=.707){\n    const w=2*Math.PI*this.clamp(f,10,sampleRate*.45)/sampleRate;\n    const a=Math.sin(w)/(2*Math.max(.1,q)),cc=Math.cos(w);\n    const b0=(1+cc)/2,b1=-(1+cc),b2=(1+cc)/2;\n    const a0=1+a,a1=-2*cc,a2=1-a;\n    return[b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]\n  }\n  dynamicStereo(l,r,stereo){
    const s=this.s,c=this.ch[0];
    if(s.eq.bypass||s.dyn?.bypass)return[l,r];
    const invSqrt2=0.7071067811865476;
    let mid=stereo?(l+r)*invSqrt2:l;
    let side=stereo?(l-r)*invSqrt2:0;
    const knee=10;
    for(let b=0;b<4;b++){
      if(s.bandBypass?.[b])continue;
      const f=this.clamp(Number(s.eq.freq[b]||1000),20,20000);
      const baseQ=this.clamp(Number(s.eq.q[b]||.707),.1,18);
      const offset=this.clamp(Number(s.eq.gain[b]||0),-24,24);
      const target=this.clamp(Number(s.dyn.target[b]??offset),-24,24);
      const dynamicsSigned=this.clamp(Number(s.dyn.dynamics[b]??0),-100,100)/100;
      const dynamicsAmount=Math.abs(dynamicsSigned);
      const dynamicsDirection=dynamicsSigned>=0?1:-1;
      const thr=this.clamp(Number(s.dyn.threshold[b]??-24),-60,0);
      const attack=this.clamp(Number(s.dyn.attack[b]||5),.1,200);
      const release=this.clamp(Number(s.dyn.release[b]||100),5,2000);
      const ac=this.tc(attack),rc=this.tc(release);
      const ms=this.clamp(Number(s.dyn.ms[b]??50),0,100);
      const mw=this.clamp(ms/50,0,1),sw=this.clamp((100-ms)/50,0,1);
      const bpCoef=this.bp(f,baseQ);
      const md=c.dynMid[b],sd=c.dynSide[b];
      const dm=this.biquad(mid,bpCoef,md.det);
      const ds=stereo?this.biquad(side,bpCoef,sd.det):0;
      const mDb=this.g2db(Math.abs(dm)+1e-6);
      const sDb=stereo?this.g2db(Math.abs(ds)+1e-6):-120;
      const mt=mDb>md.env?ac*mDb+(1-ac)*md.env:rc*md.env+(1-rc)*mDb;
      const st=sDb>sd.env?ac*sDb+(1-ac)*sd.env:rc*sd.env+(1-rc)*sDb;
      md.env=Number.isFinite(mt)?mt:-120;
      sd.env=Number.isFinite(st)?st:-120;
      const slowTc=this.tc(120);
      md.slow=slowTc*(md.slow??-120)+(1-slowTc)*mDb;
      sd.slow=slowTc*(sd.slow??-120)+(1-slowTc)*sDb;

      const activation=(level,below)=>{
        let a=0;
        if(!below){
          const lo=thr-knee;
          if(level<=lo)a=0;
          else if(level>=thr)a=1;
          else {const t=(level-lo)/knee;a=t*t*(3-2*t);}
        }else{
          const hi=thr+knee;
          if(level>=hi)a=0;
          else if(level<=thr)a=1;
          else {const t=(hi-level)/knee;a=t*t*(3-2*t);}
        }
        return this.clamp(a*dynamicsAmount,0,1);
      };

      let midLevel=md.env,sideLevel=sd.env;
      if(s.dyn.detectOnsets?.[b]){
        midLevel+=this.clamp(Math.max(0,mDb-md.slow)*1.5,0,12);
        sideLevel+=this.clamp(Math.max(0,sDb-sd.slow)*1.5,0,12);
      }

      const ma=activation(midLevel,!!s.dyn.triggerBelow?.[b]);
      const sa=activation(sideLevel,!!s.dyn.triggerBelow?.[b]);
      const mtc=ma>(md.activation??0)?ac:rc;
      const stc=sa>(sd.activation??0)?ac:rc;
      md.activation=mtc*(md.activation??0)+(1-mtc)*ma;
      sd.activation=stc*(sd.activation??0)+(1-stc)*sa;

      const delta=dynamicsDirection*Math.abs(target-offset);
      const mChange=delta*md.activation*mw;
      const sChange=delta*sd.activation*sw;
      s.dyn.gainMid[b]=.90*Number(s.dyn.gainMid[b]||0)+.10*mChange;
      s.dyn.gainSide[b]=.90*Number(s.dyn.gainSide[b]||0)+.10*sChange;

      const mGain=this.clamp(offset+s.dyn.gainMid[b],-24,24);
      const sGain=this.clamp(offset+s.dyn.gainSide[b],-24,24);
      const mq=this.clamp(baseQ/(1+.045*Math.abs(mGain)),.1,18);
      const sq=this.clamp(baseQ/(1+.045*Math.abs(sGain)),.1,18);
      const mCoef=this.peak(sampleRate,f,mq,mGain);
      const sCoef=this.peak(sampleRate,f,sq,sGain);

      md.eq.z1=md.eq.z1||0;sd.eq.z1=sd.eq.z1||0;
      mid=this.biquad(mid,mCoef,md.eq);

  const r=eqCanvas.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width),y=clamp(e.clientY-r.top,0,r.height),w=r.width,h=r.height;
  hoverDynamicBand=dynamicBandAtPointer(x,y,w,h);
  if(dragDynamicMsBand>=0){const p=dynamicPopupBounds(dragDynamicMsBand,w,h),bar={x:p.x+12,y:p.y+50,w:p.w-24,h:11};state.dyn.ms[dragDynamicMsBand]=clamp((x-bar.x)/bar.w*100,0,100);sendParams();drawEQ();return;}
  if(dragDynamicTargetBand>=0){state.dyn.target[dragDynamicTargetBand]=clamp(dynGainStartTarget-(y-dynGainStartY)/Math.max(1,h)*36,-24,24);sendParams();drawEQ();return;}
  if(dragXover>=0){
    let f=invLog(x/w);
    if(dragXover===0)f=clamp(f,40,Math.min(1000,state.ott.x[1]-80));
    else if(dragXover===1)f=clamp(f,state.ott.x[0]+80,Math.min(5000,state.ott.x[2]-200));
    else f=clamp(f,state.ott.x[1]+200,18000);
    state.ott.x[dragXover]=f;sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  if(drag<0){drawEQ();return;}
  const fineScale=e.shiftKey?0.1:1;
  const freqSkew=5.02888112;
  const startNorm=Math.pow(clamp((dynFreqStartHz-20)/(20000-20),0,1),1/freqSkew);
  const norm=clamp(startNorm+(x-dynFreqStartX)/180*fineScale,0,1);
  const hzv=20+(20000-20)*Math.pow(norm,freqSkew);
  const deltaDb=-(y-dynGainStartY)/Math.max(1,h)*36*fineScale;
  state.eq.freq[drag]=hzv;
  state.eq.gain[drag]=clamp(dynGainStartOffset+deltaDb,-24,24);
  state.dyn.target[drag]=clamp(dynGainStartTarget+deltaDb,-24,24);
  sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());
});
eqCanvas.addEventListener("pointerup",()=>{drag=-1;dragXover=-1;dragDynamicMsBand=-1;dragDynamicTargetBand=-1;drawEQ();});
eqCanvas.addEventListener("pointercancel",()=>{drag=-1;dragXover=-1;dragDynamicMsBand=-1;dragDynamicTargetBand=-1;drawEQ();});

function stopPlayback(){if(source){try{source.stop()}catch{}try{source.disconnect()}catch{}source=null}playing=false;$("#status").textContent="READY"}
async function loadAudioFile(file){if(!file)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();$("#status").textContent="DECODING…";audioBuffer=await audioCtx.decodeAudioData(await file.arrayBuffer());$("#fileName").textContent=file.name;$("#status").textContent="READY"}catch(e){$("#status").textContent="LOAD ERROR"}}
async function startPlayback(){if(!audioBuffer){$("#status").textContent="先 LOAD AUDIO";return}await ensureAudioGraph();await audioCtx.resume();stopPlayback();source=audioCtx.createBufferSource();source.buffer=audioBuffer;source.loop=true;source.connect(workletNode);source.onended=()=>{if(playing){source=null;return}playing=false;$("#status").textContent="READY"};source.start();playing=true;$("#status").textContent="PLAYING · LOOP"}
$("#audioFileInput").addEventListener("change",e=>loadAudioFile(e.target.files[0]));$("#playBtn").onclick=()=>startPlayback().catch(()=>$("#status").textContent="PLAY ERROR");$("#stopBtn").onclick=stopPlayback;$("#resetBtn").onclick=()=>location.reload();
</script>
