function sendParams(){
  // Coalesce high-rate knob/graph events into one full-state transfer per UI frame.
  // This prevents a MessagePort backlog from starving the realtime render thread.
  if(!workletNode||directFallback||workletFaulted)return;
  if(paramSyncScheduled)return;
  paramSyncScheduled=true;
  const flush=()=>{
    paramSyncScheduled=false;
    if(!workletNode||directFallback||workletFaulted)return;
    try{
      paramSyncRevision++;
      workletNode.port.postMessage({
        type:"params",
        revision:paramSyncRevision,
        state:structuredClone(state)

      workletFaulted=true;

      }else{
        $("#status").textContent="DSP PARAM ERROR · "+(err?.message||"clone/post failed");

  };

function makeKnob(parent,cfg){
  const{label,get,set,min,max,suffix="",accent="#38bdf8",formatDigits=1,formatValue=null}=cfg;
  const curMin=()=>cfg.dynamicMin?cfg.dynamicMin():min;
  const curMax=()=>cfg.dynamicMax?cfg.dynamicMax():max;
  const curSensitivity=()=>cfg.dynamicSensitivity?cfg.dynamicSensitivity():(cfg.sensitivity??1);
  const curWheelStep=()=>cfg.dynamicWheelStep?cfg.dynamicWheelStep():(cfg.wheelStep??null);
  const curFineStep=()=>cfg.dynamicFineStep?cfg.dynamicFineStep():0.01;
  const w=document.createElement("div");w.className="knob";w.style.setProperty("--accent",accent);if(cfg.controlId)w.dataset.controlId=cfg.controlId;
  const d=document.createElement("div");d.className="dial";
  const t=document.createElement("div");t.className="knobTitle";t.textContent=label;
  const v=document.createElement("div");v.className="knobValue";
  const discreteMode=cfg.controlId==="DEESS_MODE";
  if(discreteMode){
    d.classList.add("deEssModeDial");
    ["I","II","III","IV"].forEach((labelText,index)=>{
      const tick=document.createElement("span");
      tick.className="deEssModeTick";
      tick.textContent=labelText;
      const a=(210+index*40)*Math.PI/180;
      tick.style.left=(50+43*Math.cos(a))+"%";
      tick.style.top=(50+43*Math.sin(a))+"%";
      d.appendChild(tick);
    });
  }
  v.contentEditable="true";
  v.spellcheck=false;
  v.setAttribute("inputmode","decimal");
  w.append(d,t,v);parent.appendChild(w);
  const def=get();
  const render=()=>{
    const n=get(),lo=curMin(),hi=curMax();
    t.textContent=cfg.dynamicLabel?cfg.dynamicLabel():label;
    if(document.activeElement!==v)
      v.textContent=formatValue?formatValue(n):fmt(n,formatDigits)+suffix;
    dialVisual(d,n,lo,hi,accent);
    if(cfg.mutedWhen)w.classList.toggle("knobMuted",!!cfg.mutedWhen())
  };
  const apply=n=>{
    const next=clamp(n,curMin(),curMax());
    if(cfg.markTouched)cfg.markTouched();
    set(next);
    if(cfg.afterSet)cfg.afterSet(next);
    render();
    if(label==="UDMBC %"||label==="MAXIMUM REDUCTION")knobRefreshers.forEach(fn=>fn());
    if(label==="MAXIMUM REDUCTION")document.querySelectorAll(".deessZone").forEach(z=>z.closest(".band")?.classList.toggle("deessMuted",state.de.threshold<=0.0001));
    sendParams();drawEQ()
  };
  const logarithmic=cfg.logWheel??(/FREQ|X-OVER|XOVER/.test(label));
  const defaultWheelStep=(
    /Q$/.test(label)?0.02:
    /GAIN|LEVEL|THRESH|OUT/.test(label)?0.5:
    /ATTACK/.test(label)?1:
    /RELEASE/.test(label)?5:
    /DEGREE|MIX|COLOR/.test(label)?1:
    discreteMode?1:
    Math.max(0.1,(max-min)*0.01)
  );
  const freqSkew=5.02888112;
  const freqToNorm=x=>Math.pow(clamp((x-20)/(20000-20),0,1),1/freqSkew);
  const normToFreq=x=>20+(20000-20)*Math.pow(clamp(x,0,1),freqSkew);
  let wheelRemainder=0,dragging=false,dragStartY=0,dragStartValue=0,dragStartNorm=0,dragFine=false;
  const discreteFromPointer=e=>{
    const r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let a=Math.atan2(e.clientY-cy,e.clientX-cx);
    if(a<0)a+=2*Math.PI;
    const start=7*Math.PI/6,end=11*Math.PI/6;
    a=clamp(a,start,end);
    const index=Math.round((a-start)/(end-start)*3);
    apply(min+index*(max-min)/3);
  };
  knobRefreshers.push(render);
  const parseEnteredValue=raw=>{
    if(cfg.parseValue)return cfg.parseValue(raw);
    const s=String(raw??"").trim().toLowerCase();
    let n=parseFloat(s.replace(/[^0-9+\-.]/g,""));
    if(!Number.isFinite(n))return NaN;
    if(/freq/i.test(label)&&s.includes("k"))n*=1000;
    return n;
  };
  v.addEventListener("pointerdown",e=>e.stopPropagation());
  v.addEventListener("focus",()=>{
    v.dataset.original=v.textContent;
    requestAnimationFrame(()=>{
      const sel=window.getSelection(),range=document.createRange();
      range.selectNodeContents(v);sel.removeAllRanges();sel.addRange(range);
    });
  });
  v.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();v.blur()}
    else if(e.key==="Escape"){
      e.preventDefault();

      v.dataset.cancelEdit="1";
      v.blur();
    }
  });
  v.addEventListener("blur",()=>{
    if(v.dataset.cancelEdit==="1"){
      delete v.dataset.cancelEdit;render();return;
    }
    const parsed=parseEnteredValue(v.textContent);
    if(Number.isFinite(parsed))apply(parsed);else render();
  });
  d.addEventListener("pointerdown",e=>{
    d.setPointerCapture(e.pointerId);
    dragging=true;dragFine=!!e.shiftKey;dragStartY=e.clientY;dragStartValue=get();

  });

}

      state.solo.graphActive=true;state.solo.graphFreq=state.eq.freq[band];
      state.solo.graphQ=isRollOffType(band)?.70710678:state.eq.q[band];
      showGraphHint(e,graphHintBandHtml(band,rightSoloDynamic?4:8));sendParams();drawEQ();return;
    }
  }
  // Crossover curvature / OVERLAP is controlled ONLY by the bottom infinity marker.
  const xo=state.udmbc.x.map(v=>logX(v,w));let xb=10,xi=-1;
  const markerY=h-18;
  for(let i=0;i<3;i++){const dd=Math.hypot(xo[i]-x,markerY-y);if(dd<xb){xb=dd;xi=i;}}
  if(xi>=0){
    e.preventDefault();
    const ov=state.udmbc.overlap??[50,50,50];
    const next=clamp((ov[xi]??50)-e.deltaY*.50,0,100);
    ov[0]=ov[1]=ov[2]=next;
    setGraphControls(["XOVER_OVERLAP"],false);
    sendParams();drawEQ();return;
  }
  // Wheel on either the static EQ point or active DYNAMICS point
  // adjusts the same shared Q parameter.
  let best=13,band=-1,dynamicWheelReadout=false;
  for(let b=0;b<4;b++){
    const px=logX(state.eq.freq[b],w);
    const eqY=dbToY(state.eq.gain[b],h);
    const eqD=Math.hypot(px-x,eqY-y);
    if(eqD<best){best=eqD;band=b;dynamicWheelReadout=false;}
    const dyn=Number(state.dyn.dynamics[b]||0);
    if(Math.abs(dyn)>0.01){
      const target=dynamicTargetPoint(b,w,h);
      const dynD=Math.hypot(target.x-x,target.y-y);
      if(dynD<best){best=dynD;band=b;dynamicWheelReadout=true;}
    }
  }
  if(band<0)return;
  e.preventDefault();
  setGraphControls(["EQ"+(band+1)+"_Q"],false);
  if(isRollOffType(band)){
    const dir=e.deltaY>0?1:-1;
    state.eq.slope[band]=clamp(Math.round(Number(state.eq.slope[band]??1))+dir,0,6);
  }else{
    state.eq.q[band]=nextQFromWheel(state.eq.q[band],e.deltaY,e.shiftKey);
  }
  knobRefreshers.forEach(fn=>fn());
  showGraphHint(e,graphHintBandHtml(band,dynamicWheelReadout?4:8));
  sendParams();drawEQ();
},{passive:false});
function resetGraphGainAtDoubleClick(e){
  if(e.button!==0)return;
  const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,h=r.height;

  let dynamicBand=-1,bestDynamic=13;
  for(let b=0;b<4;b++){
    const dynamics=Math.abs(Number(state.dyn.dynamics[b]||0));
    if(dynamics<=.05)continue;
    const target=dynamicTargetPoint(b,w,h);
    const d=Math.hypot(x-target.x,y-target.y);
    if(d<=bestDynamic){bestDynamic=d;dynamicBand=b;}
  }

  let staticBand=-1,bestStatic=8;
  for(let b=0;b<4;b++){
    const px=logX(state.eq.freq[b],w),py=dbToY(state.eq.gain[b],h);
    const d=Math.hypot(x-px,y-py);
    if(d<=bestStatic){bestStatic=d;staticBand=b;}
  }

  if(dynamicBand>=0&&(staticBand<0||bestDynamic<=bestStatic)){
    state.dyn.dynamics[dynamicBand]=0;
    knobRefreshers.forEach(fn=>fn());
    setGraphControls(["DYN_DYNAMICS"+(dynamicBand+1)],false);
    sendParams();drawEQ();
    e.preventDefault();
    return;
  }

  if(staticBand>=0){
    state.eq.gain[staticBand]=0;
    knobRefreshers.forEach(fn=>fn());
    setGraphControls(["EQ"+(staticBand+1)+"_GAIN"],false);
    sendParams();drawEQ();
    e.preventDefault();
  }
}
eqCanvas.addEventListener("dblclick",resetGraphGainAtDoubleClick);
eqCanvas.addEventListener("pointerdown",e=>{
  const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,h=r.height;
  if(expandedDynamicBand>=0&&e.button!==2){
    const p=dynamicPopupBounds(expandedDynamicBand,w,h);
    if(!(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h)){
      expandedDynamicBand=-1;dragDynamicMsBand=-1;dragMode=0;drawEQ();return;
    }
  }
  if(e.button===2){
    const hit=graphHoverTarget(x,y,w,h),band=hit.band;
    if(band>=0){
      e.preventDefault();closeEqTypeMenu();
      expandedDynamicBand=-1;dragDynamicMsBand=-1;dragMode=8;dragBand=-1;
      pendingRightBand=band;
      pendingRightDynamic=!!(hit.mask&4);
      pendingRightX=x;pendingRightY=y;
      eqCanvas.setPointerCapture(e.pointerId);hideGraphHint();drawEQ();return;
    }
  }
  if(expandedDynamicBand>=0){
    const p=dynamicPopupBounds(expandedDynamicBand,w,h),bar={x:p.x+12,y:p.y+50,w:p.w-24,h:11};
    if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){
      if(e.button===0&&x>=bar.x&&x<=bar.x+bar.w&&y>=bar.y-8&&y<=bar.y+20){
        dragDynamicMsBand=expandedDynamicBand;dragMode=3;
        eqCanvas.setPointerCapture(e.pointerId);
        state.dyn.ms[dragDynamicMsBand]=clamp((x-bar.x)/bar.w*100,0,100);
        sendParams();drawEQ();
      }
      return;
    }
  }
  if(e.button!==0)return;

  // Dedicated DYNAMICS arrow handle; priority above the EQ XY node.
  for(let b=0;b<4;b++){
    const dyn=Number(state.dyn.dynamics[b]||0);
    const target=dynamicTargetPoint(b,w,h);
    const handleX=clamp(target.x+31,18,w-12),handleY=target.y;
    if(Math.abs(dyn)<=.05&&Math.abs(x-handleX)<=3&&Math.abs(y-handleY)<=7){
      dragMode=5;dragDynamicHandleBand=b;dragBand=-1;dragXover=-1;dragDynamicMsBand=-1;
      setGraphControls(["DYN_DYNAMICS"+(b+1)],false);
      dynHandleStartY=y;dynHandleStartValue=dyn;
      eqCanvas.setPointerCapture(e.pointerId);
      showGraphHint(e,graphHintBandHtml(b,1|4));
      drawEQ();
      return;
    }
  }

  // The exact static EQ GAIN node wins only when the two nodes overlap.
  // The entire Dynamic Target circle, including its centre, is one XY control:
  // X = linked EQ FREQ, Y = linked DYNAMICS.
  const staticBand=staticEqAtPointer(x,y,w,h);
  if(staticBand<0){
    const tb=dynamicTargetAtPointer(x,y,w,h);
    if(tb>=0){
      dragMode=2;dragBand=tb;dragXover=-1;dragDynamicTargetBand=tb;
      setGraphControls(["EQ"+(tb+1)+"_FREQ","DYN_DYNAMICS"+(tb+1)],false);
      dynFreqStartHz=state.eq.freq[tb];
      dynFreqGrabOffsetX=x-logX(dynFreqStartHz,w);
      dynDynamicsStartY=y;
      dynDynamicsStartValue=state.dyn.dynamics[tb];
      dynTargetStartFreq=state.eq.freq[tb];
      dynTargetStartX=x;
      eqCanvas.setPointerCapture(e.pointerId);
      showGraphHint(e,graphHintBandHtml(tb,1|4));
      return;
    }
  }

  // Static EQ node.
  if(staticBand>=0){
    dragMode=1;dragBand=staticBand;dragXover=-1;dragDynamicTargetBand=-1;eqDragAxis=0;
    setGraphControls(["EQ"+(staticBand+1)+"_FREQ","EQ"+(staticBand+1)+"_GAIN"],false);
    dynFreqStartHz=state.eq.freq[staticBand];
    dynFreqStartX=x;
    dynFreqGrabOffsetX=x-logX(dynFreqStartHz,w);
    dynGainStartY=y;dynGainStartOffset=state.eq.gain[staticBand];
    eqCanvas.setPointerCapture(e.pointerId);
    showGraphHint(e,graphHintBandHtml(staticBand,1|2));
    return;
  }

  // Bottom figure-eight marker = continuous shared OVERLAP control.
  const xo=state.udmbc.x.map(v=>logX(v,w));
  const markerY=h-18;
  for(let i=0;i<3;i++){
    if(Math.hypot(xo[i]-x,markerY-y)<14){
      dragMode=6;
      dragOverlapXover=i;
      dragXover=-1;
      overlapDragStartY=y;
      overlapDragStartValue=Number(state.udmbc.overlap?.[i]??50);
      setGraphControls(["XOVER_OVERLAP"],false);
      eqCanvas.setPointerCapture(e.pointerId);
      showGraphHint(e,"X"+(i+1)+"  OVERLAP "+fmt(overlapDragStartValue,1)+"%");
      return;
    }
  }

  // X1/X2/X3 crossover lines.
  for(let i=0;i<3;i++)if(Math.abs(xo[i]-x)<14){dragMode=4;dragXover=i;setGraphControls(["UDMBC_X"+(i+1)],false);eqCanvas.setPointerCapture(e.pointerId);return;}
});
eqCanvas.addEventListener("pointermove",e=>{
  const r=eqCanvas.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width),y=clamp(e.clientY-r.top,0,r.height),w=r.width,h=r.height;
  if(dragMode===8&&pendingRightBand>=0&&(e.buttons&2)){
    if(Math.hypot(x-pendingRightX,y-pendingRightY)<=3)return;
    dragMode=7;dragBand=pendingRightBand;
    rightSoloDynamic=pendingRightDynamic;
    pendingRightBand=-1;pendingRightDynamic=false;
    soloSpotX=x;soloSpotY=y;
    state.solo.graphActive=true;
    state.solo.graphFreq=state.eq.freq[dragBand];
    state.solo.graphQ=isRollOffType(dragBand)?.70710678:state.eq.q[dragBand];
    setGraphControls(
      rightSoloDynamic
        ?["EQ"+(dragBand+1)+"_FREQ","DYN_DYNAMICS"+(dragBand+1)]
        :["EQ"+(dragBand+1)+"_FREQ","EQ"+(dragBand+1)+"_GAIN"],
      false);
    sendParams();
  }
  if(state.solo.graphActive&&(e.buttons&2)){soloSpotX=x;soloSpotY=y;}
  hoverDynamicBand=dynamicTargetAtPointer(x,y,w,h);
  if(dragMode===7&&dragBand>=0){
    const hzv=invLog(clamp(x,0,w)/w);
    state.eq.freq[dragBand]=hzv;

    if(rightSoloDynamic){
      const targetGain=yToDb(y,h);
      const offset=clamp(Number(state.eq.gain[dragBand]||0),-18,18);
      state.dyn.dynamics[dragBand]=clamp((targetGain-offset)/18*100,-100,100);
      setGraphControls(["EQ"+(dragBand+1)+"_FREQ","DYN_DYNAMICS"+(dragBand+1)],true);
      showGraphHint(e,graphHintBandHtml(dragBand,1|4));
    }else{
      const gain=yToDb(y,h);
      state.eq.gain[dragBand]=gain;
      setGraphControls(["EQ"+(dragBand+1)+"_FREQ","EQ"+(dragBand+1)+"_GAIN"],true);
      showGraphHint(e,graphHintBandHtml(dragBand,1|2));
    }

    state.solo.graphActive=true;
    state.solo.graphFreq=hzv;
    state.solo.graphQ=isRollOffType(dragBand)?.70710678:state.eq.q[dragBand];
    sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  if(dragDynamicMsBand>=0){
    const p=dynamicPopupBounds(dragDynamicMsBand,w,h),bar={x:p.x+12,y:p.y+50,w:p.w-24,h:11};
    state.dyn.ms[dragDynamicMsBand]=clamp((x-bar.x)/bar.w*100,0,100);sendParams();drawEQ();return;
  }
  if(dragMode===5&&dragDynamicHandleBand>=0){
    const fine=e.shiftKey?0.1:1;
    const deltaDynamics=-(y-dynHandleStartY)/Math.max(1,h)*200*fine;
    state.dyn.dynamics[dragDynamicHandleBand]=clamp(dynHandleStartValue+deltaDynamics,-100,100);
    setGraphControls(["DYN_DYNAMICS"+(dragDynamicHandleBand+1)],true);
    showGraphHint(e,graphHintBandHtml(dragDynamicHandleBand,4));
    sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  if(dragMode===1&&dragBand>=0){
    // Exact cursor tracking on a nonlinear mastering gain scale: ±3 dB slowest, then progressively faster.
    const hzv=invLog(clamp(x,0,w)/w);
    const gainAtCursor=yToDb(y,h);
    state.eq.freq[dragBand]=hzv;
    state.eq.gain[dragBand]=gainAtCursor;
    setGraphControls(["EQ"+(dragBand+1)+"_FREQ","EQ"+(dragBand+1)+"_GAIN"],true);
    showGraphHint(e,graphHintBandHtml(dragBand,1|2));
    sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  if(dragMode===2&&dragBand>=0){
    // Absolute graph-pixel mapping: Dynamic Target follows the cursor directly.
    const hzv=invLog(clamp(x,0,w)/w);
    const targetGain=yToDb(y,h);
    const offset=clamp(Number(state.eq.gain[dragBand]||0),-18,18);
    state.eq.freq[dragBand]=hzv;
    state.dyn.dynamics[dragBand]=clamp((targetGain-offset)/18*100,-100,100);
    setGraphControls(["EQ"+(dragBand+1)+"_FREQ","DYN_DYNAMICS"+(dragBand+1)],true);
    showGraphHint(e,graphHintBandHtml(dragBand,1|4));
    sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  if(dragMode===6&&dragOverlapXover>=0){
    const fine=e.shiftKey?0.1:1;
    const next=clamp(overlapDragStartValue-(y-overlapDragStartY)/Math.max(1,h)*200*fine,0,100);
    state.udmbc.overlap[0]=state.udmbc.overlap[1]=state.udmbc.overlap[2]=next;
    setGraphControls(["XOVER_OVERLAP"],true);
    sendParams();drawEQ();return;
  }
  if(dragMode===4&&dragXover>=0){
    let f=invLog(x/w);
    if(dragXover===0)f=clamp(f,40,Math.min(1000,state.udmbc.x[1]-80));
    else if(dragXover===1)f=clamp(f,state.udmbc.x[0]+80,Math.min(5000,state.udmbc.x[2]-200));
    else f=clamp(f,state.udmbc.x[1]+200,18000);
    state.udmbc.x[dragXover]=f;setGraphControls(["UDMBC_X"+(dragXover+1)],true);sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  drawEQ();
});
eqCanvas.addEventListener("pointerup",e=>{
  if(dragMode===8&&pendingRightBand>=0){
    const b=pendingRightBand;
    pendingRightBand=-1;pendingRightDynamic=false;
    openEqTypeMenu(b,e.clientX,e.clientY);
  }
  if(state.solo.graphActive){state.solo.graphActive=false;sendParams();}
  const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,h=r.height;
  const hit=graphHoverTarget(x,y,w,h);
  if(hit.band>=0)showGraphHint(e,graphHintBandHtml(hit.band,hit.mask));else hideGraphHint();
  dragMode=0;dragBand=-1;rightSoloDynamic=false;dragXover=-1;dragOverlapXover=-1;dragDynamicMsBand=-1;dragDynamicTargetBand=-1;dragDynamicHandleBand=-1;eqDragAxis=0;clearGraphControls();drawEQ();
});
eqCanvas.addEventListener("pointercancel",e=>{
  pendingRightBand=-1;pendingRightDynamic=false;rightSoloDynamic=false;
  if(state.solo.graphActive){state.solo.graphActive=false;sendParams();}
  const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,h=r.height;
  const hit=graphHoverTarget(x,y,w,h);
  if(hit.band>=0)showGraphHint(e,graphHintBandHtml(hit.band,hit.mask));else hideGraphHint();
  dragMode=0;dragBand=-1;dragXover=-1;dragOverlapXover=-1;dragDynamicMsBand=-1;dragDynamicTargetBand=-1;dragDynamicHandleBand=-1;eqDragAxis=0;clearGraphControls();drawEQ();
});
function stopPlayback(){if(source){try{source.stop()}catch{}try{source.disconnect()}catch{}source=null}playing=false;$("#status").textContent="READY"}
async function loadAudioFile(file){
  if(!file||!(file.type||"").startsWith("audio/")){$("#status").textContent="請拖入音訊檔";return}
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    await audioCtx.resume();
    $("#status").textContent="DECODING…";
    const data=await file.arrayBuffer();
    audioBuffer=await audioCtx.decodeAudioData(data);
    $("#fileName").textContent=file.name;
    $("#cursorTime").textContent="0:00.000";
    $("#status").textContent="READY";
  }catch(e){
    audioBuffer=null;
    $("#status").textContent="LOAD ERROR · "+(e?.message||"decode failed");
  }
}
function bindAudioDrop(){
  const app=document.querySelector(".app"),loader=document.querySelector(".transport .tiny");
  if(!app)return;
  const prevent=e=>{e.preventDefault();e.stopPropagation()};
  ["dragenter","dragover","dragleave","drop"].forEach(type=>app.addEventListener(type,prevent));
  ["dragenter","dragover"].forEach(type=>app.addEventListener(type,()=>app.classList.add("audioDragOver")));
  ["dragleave","drop"].forEach(type=>app.addEventListener(type,()=>app.classList.remove("audioDragOver")));
  app.addEventListener("drop",e=>{
    const file=e.dataTransfer?.files?.[0];
    if(file)loadAudioFile(file);
  });
  if(loader)loader.addEventListener("dragover",prevent);
}

async function startPlayback(){
  if(!audioBuffer){$("#status").textContent="先 LOAD AUDIO";return}
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  stopPlayback();
  directFallback=false;
  workletFaulted=false;
  workletHeartbeatSeen=false;
  paramSyncScheduled=false;
  try{await ensureAudioGraph()}catch(err){
    directFallback=false;
    workletFaulted=true;
    $("#status").textContent="DSP ERROR · "+(err?.message||"AudioWorklet unavailable");
    return;
  }
  source=audioCtx.createBufferSource();
  source.buffer=audioBuffer;
  source.loop=true;
  source.connect(directFallback?audioCtx.destination:workletNode);
  source.onended=()=>{if(playing){source=null;return}playing=false;$("#status").textContent="READY"};
  source.start();playing=true;$("#status").textContent="PLAYING · LOOP";
  // Give the worklet enough time to publish its ready heartbeat before any
  // compatibility fallback. A transient startup delay must never disable DSP.
  setTimeout(()=>{
    if(playing&&!workletHeartbeatSeen&&!directFallback&&!workletFaulted){
      switchToDirectAudioFallback();
    }
  },3500);
}
$("#audioFileInput").addEventListener("change",e=>loadAudioFile(e.target.files[0]));bindAudioDrop();$("#playBtn").onclick=()=>startPlayback().catch(()=>$("#status").textContent="PLAY ERROR");$("#stopBtn").onclick=stopPlayback;$("#resetBtn").onclick=()=>location.reload();
</script>
