<style>

.leds{margin-left:auto;display:flex;gap:10px}.ledBox{display:grid;grid-template-columns:21px auto;gap:3px;align-items:center;cursor:pointer}.led{width:19px;height:19px;border-radius:50%;border:1px solid #555b63;background:#171a1f;box-shadow:inset 0 2px 3px #000,0 2px 4px #000}.led.on{background:radial-gradient(circle at 36% 30%,#fff 0%,var(--led) 22%,#25272b 78%,#101216 100%);box-shadow:0 0 10px var(--led),inset 0 1px #fff5}.ledLabel{font:7px Consolas;color:#a9b0b9}

-origin:50% 25px;border-radius:2px}.dial{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 9px #000c,inset 0 1px 2px #fff2}.dial:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#eef2f7;transform:translate(-50%,-50%)}.knobTitle{height:13px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.knobValue{height:16px;line-height:14px;border:1px solid #050608;border-radius:3px;background:#07090b;color:#dce2e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8.8px}
.advPopup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,calc(100% - 40px));height:330px;border:1px solid #facc15cc;border-radius:10px;background:linear-gradient(180deg,#28231a,#101216);z-index:50;padding:8px 12px;box-shadow:0 18px 44px #000c,0 0 0 1px #0009}.advPopupHead{height:34px;display:flex;align-items:center;justify-content:space-between;color:#facc15;font:10px Consolas;font-weight:900}.advPopupClose{height:21px;padding:0 8px;border:1px solid #5c4e1f;border-radius:4px;background:#17150f;color:#ffdf62;font:8px Consolas}.advPopupGrid{height:276px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:1fr 1fr;gap:2px}.advPopupGrid .dial{width:50px;height:50px}.advPopupGrid .dial:before{height:14px;transform-origin:50% 22px}.advPopupGrid .knobTitle{font-size:6.82px;height:11px}.advPopupGrid .knobValue{font-size:7.7px;height:14px;line-height:12px}.advPopupGrid .tiny{height:22px;padding:0 3px;font-size:6.5px;margin:auto}
.footer{display:none}.miniMix{margin-left:auto;display:flex;align-items:center;gap:8px}.miniCtl{display:grid;grid-template-columns:27px 72px;gap:4px;align-items:center;font:7px Consolas;color:#aab1ba}.miniCtl input{width:72px;height:13px;accent-color:var(--blue)}.miniCtl.out input{accent-color:var(--out)}.masterBypass{height:27px;min-width:72px;padding:0 9px;border:1px solid #69717b;border-radius:4px;background:#20242a;color:#e9eef3;font:9px Consolas;font-weight:900}.masterBypass.on{background:#e6edf4;color:#0a0c0f;box-shadow:0 0 12px #dfe7ef88}.leds{margin-left:8px}.note{display:none}select{height:27px;background:#0f1115;color:#dce2e8;border:1px solid #3b4047;border-radius:4px;font-size:8px}

<body>
<div class="app"><span hidden>NO PAGE SCROLL</span>
  <div class="transport">
    <label class="tiny"><input id="audioFileInput" type="file" accept="audio/*" hidden>LOAD AUDIO</label>

    <div class="graph"><canvas id="eqCanvas"></canvas></div>
  </div>

</div>
<script>
const $=s=>document.querySelector(s);let audioCtx=null,audioBuffer=null,source=null,workletNode=null,workletModuleUrl=null,playing=false;
const eqCanvas=$("#eqCanvas"),eqCtx=eqCanvas.getContext("2d");
const state={eq:{bypass:false,freq:[80,350,2500,10000],gain:[0,0,0,0],q:[.707,.707,.707,.707],color:35,hp:70},ott:{bypass:false,bandBypass:[false,false,false,false],degree:[35,35,30,25],liftT:[-45,-45,-45,-45],liftA:[1,1,1,1],liftR:[50,50,50,50],liftM:[100,100,100,100],compT:[-18,-18,-18,-18],compA:[1,1,1,1],compR:[50,50,50,50],compM:[100,100,100,100],level:[0,0,0,0],x:[120,1000,7000],input:0,gate:-80,mix:25,clip:false,output:0},type:{bypass:false,bandBypass:[false,false,false,false],degree:[0,20,70,55],level:[0,0,1,1],attack:10,release:120,input:0,mix:100,output:0},de:{bypass:false,freq:12500,intensity:10,offset:0},mix:{bypass:false,drywet:100,output:0}};
const defaults=structuredClone(state),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=(v,d=1)=>Number(v).toFixed(d),logX=(hz,w)=>Math.log10(clamp(hz,20,20000)/20)/3*w,invLog=x=>20*Math.pow(1000,clamp(x,0,1));
const WORKLET_SOURCE="class VVChainWorklet extends AudioWorkletProcessor {\n  constructor(){\n    super();\n    this.ready=false; this.s=null;\n    this.N=8192;\n    this.frame=[new Float32Array(this.N),new Float32Array(this.N)];\n    this.fill=0;\n    this.queue=[new Float32Array(this.N*2),new Float32Array(this.N*2)];\n    this.dryQueue=[new Float32Array(this.N*2),new Float32Array(this.N*2)];\n    this.qr=0; this.qw=0; this.qc=0; this.dqr=0; this.dqw=0;\n    this.masterBlend=0;\n    this.ch=[this.makeCh(),this.makeCh()];\n    this.re=[new Float64Array(this.N),new Float64Array(this.N)];\n    this.im=[new Float64Array(this.N),new Float64Array(this.N)];\n    this.avgSum=0; this.avgCount=0; this.sampleParity=0; this.pending=0;\n    this.port.onmessage=e=>{\n      if(e.data && e.data.type===\"params\"){this.s=e.data.state;this.ready=true}\n    };\n  }\n  makeCh(){\n    return {\n      eq:Array.from({length:4},()=>({z1:0,z2:0})),\n      hp:{z1:0,z2:0}, lp:[0,0,0], typeLp:[0,0,0], gate:0, gateBand:[0,0,0,0], lim:0,\n      lift:[1,1,1,1], comp:[0,0,0,0], typeFast:[0,0,0,0], typeSlow:[0,0,0,0], typeDc:[0,0,0,0]\n    };\n  }\n  clamp(v,a,b){return Math.max(a,Math.min(b,v))}\n  finite(v){return Number.isFinite(v)?v:0}\n  db2g(db){return Math.pow(10,db/20)}\n  g2db(g){return 20*Math.log10(Math.max(g,1e-9))}\n  tc(ms){return Math.exp(-1/(.001*Math.max(.1,ms)*sampleRate))}\n  biquad(x,c,z){const y=c[0]*x+z.z1;z.z1=c[1]*x-c[3]*y+z.z2;z.z2=c[2]*x-c[4]*y;return y}\n  peak(fs,f,q,g){\n    const A=Math.pow(10,g/40),w=2*Math.PI*this.clamp(f,10,fs*.45)/fs;\n    const a=Math.sin(w)/(2*Math.max(.1,q)),cc=Math.cos(w);\n    const b0=1+a*A,b1=-2*cc,b2=1-a*A,a0=1+a/A,a1=-2*cc,a2=1-a/A;\n    return[b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]\n  }\n  hp(fs,f,q){\n    const w=2*Math.PI*this.clamp(f,10,fs*.45)/fs,a=Math.sin(w)/(2*Math.max(.1,q)),cc=Math.cos(w);\n    const b0=(1+cc)/2,b1=-(1+cc),b2=(1+cc)/2,a0=1+a,a1=-2*cc,a2=1-a;\n    return[b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]\n  }\n  color(x,a){\n    a=this.clamp(a,0,1); if(a<=0)return x;\n    const d=1+1.35*a,z=x+.012*a*x*x;\n    const makeup=1/d;\n    return Math.tanh(z*d)*makeup\n  }\n  fft(re,im,inv){\n    const n=re.length;\n    for(let i=1,j=0;i<n;i++){\n      let bit=n>>1;\n      for(;j&bit;bit>>=1)j^=bit;\n      j^=bit;\n      if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}\n    }\n    for(let len=2;len<=n;len<<=1){\n      const ang=(inv?1:-1)*2*Math.PI/len,wr0=Math.cos(ang),wi0=Math.sin(ang);\n      for(let i=0;i<n;i+=len){\n        let wr=1,wi=0;\n        for(let j=0;j<len/2;j++){\n          const k=i+j,l=k+len/2,tr=re[l]*wr-im[l]*wi,ti=re[l]*wi+im[l]*wr,ur=re[k],ui=im[k];\n          re[l]=ur-tr;im[l]=ui-ti;re[k]=ur+tr;im[k]=ui+ti;\n          const nwr=wr*wr0-wi*wi0,nwi=wr*wi0+wi*wr0;wr=nwr;wi=nwi\n        }\n      }\n    }\n    if(inv)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n}\n  }\n  updateAverage(x){\n    if(this.sampleParity===0)this.pending=x;\n    else{this.avgSum+=Math.abs(x-this.pending);this.avgCount++}\n    this.sampleParity^=1;\n  }\n  deesser(){\n    const s=this.s.de;\n    const avg=this.avgCount>0?this.avgSum/this.avgCount:0;\n    const threshold=avg+Number(s.offset||0);\n    const trigger=10;\n    for(let ch=0;ch<2;ch++){\n      const x=this.frame[ch],re=this.re[ch],im=this.im[ch];\n      let more=0;\n      for(let i=0;i<this.N-2;i+=2)if(Math.abs(x[i+1]-x[i])>threshold)more++;\n      for(let i=0;i<this.N;i++){re[i]=x[i];im[i]=0}\n      if(!s.bypass && more>trigger){\n        this.fft(re,im,false);\n        const ref=this.clamp(Number(s.freq||12500),6000,18000);\n        const intensity=this.clamp(Number(s.intensity||10),2,10);\n        for(let i=1;i<this.N/2;i++){\n          const f=44100*i/this.N;\n          const coeff=f<ref/10?.5:f>=ref?(intensity*ref/f):(1+(intensity-1)*Math.pow(f/ref,3));\n          re[i]/=coeff;im[i]/=coeff;re[this.N-i]/=coeff;im[this.N-i]/=coeff;\n        }\n        this.fft(re,im,true);\n      }\n      const q=this.queue[ch];\n      for(let i=0;i<this.N;i++)q[ upRatio=1+depth*(4-1);\n\n        // Downward first.\n        const downDb=this.g2db(Math.abs(v)+1e-9);\n        const downThr=s.ott.compT[b];\n        const downSlope=1-1/downRatio;\n        const downTarget=downDb>downThr\n          ? (downDb-downThr)*downSlope\n          : 0;\n        const da=this.tc(s.ott.compA[b]),dr=this.tc(s.ott.compR[b]);\n        c.comp[b]=c.comp[b]*(downTarget>c.comp[b]?da:dr)\n          +(1-(downTarget>c.comp[b]?da:dr))*downTarget;\n        const downMix=this.clamp(s.ott.compM[b]/100,0,1);\n        v*=this.db2g(-c.comp[b]*downMix)+(1-downMix);\n\n        // Upward second: raise only material below the per-band threshold.\n        const upDb=this.g2db(Math.abs(v)+1e-9);\n        const upThr=s.ott.liftT[b];\n        const upSlope=1-1/upRatio;\n        const upTarget=upDb<upThr\n          ? (upThr-upDb)*upSlope\n          : 0;\n        const ua=this.tc(s.ott.liftA[b]),ur=this.tc(s.ott.liftR[b]);\n        const upGain=this.db2g(upTarget);\n        c.lift[b]=c.lift[b]*(upGain>1?ua:ur)\n          +(1-(upGain>1?ua:ur))*upGain;\n        const upMix=this.clamp(s.ott.liftM[b]/100,0,1);\n        v*=c.lift[b]*upMix+(1-upMix);\n\n        v*=this.db2g(this.clamp(s.ott.level[b],-24,12));\n        bands[b]=v;\n      }\n\n      let sum=bands[0]+bands[1]+bands[2]+bands[3];\n      // Global output safety only. It does not feed back into any band detector.\n      const ceiling=this.db2g(-.5),mag=Math.abs(sum);\n      if(mag>ceiling){\n        const excess=mag-ceiling;\n        const shaped=ceiling+excess/(1+20*excess);\n        sum=Math.sign(sum)*Math.min(shaped,.99);\n      }\n\n      if(s.ott.clip)sum=Math.tanh(sum*1.7);\n      const mix=this.clamp(s.ott.mix/100,0,1);\n      y=(original*(1-mix)+sum*mix)*this.db2g(this.clamp(s.ott.output,-24,24));\n    }\n    if(!s.type.bypass){\n      const ti=y*this.db2g(s.type.input);\n      const alphaA=this.tc(s.type.attack);\n      const alphaR=this.tc(s.type.release);\n      const alphaSlow=this.tc(s.type.release*1.   for(let b=0;b<4;b++){const px=logX(state.eq.freq[b],r.width),py=r.height-(clamp(state.eq.gain[b],-18,18)+18)/36*r.height;const d=Math.hypot(px-x,py-y);if(d<best){best=d;band=b}}
  if(band<0)return;
  e.preventDefault();
  const steps=e.deltaY/100;
  state.eq.q[band]=clamp(state.eq.q[band]*Math.exp(steps*.025),.1,18);
  sendParams();drawEQ();
},{passive:false});
let drag=-1,dragXover=-1;eqCanvas.addEventListener("pointerdown",e=>{const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const xo=state.ott.x.map(v=>logX(v,r.width));for(let i=0;i<3;i++)if(Math.abs(xo[i]-x)<11){dragXover=i;eqCanvas.setPointerCapture(e.pointerId);return}for(let b=0;b<4;b++){const px=logX(state.eq.freq[b],r.width),py=r.height-(clamp(state.eq.gain[b],-18,18)+18)/36*r.height;if(Math.hypot(px-x,py-y)<15){drag=b;eqCanvas.setPointerCapture(e.pointerId);break}}});eqCanvas.addEventListener("pointermove",e=>{if(dragXover>=0){const r=eqCanvas.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width);let f=invLog(x/r.width);if(dragXover===0)f=clamp(f,40,Math.min(1000,state.ott.x[1]-80));else if(dragXover===1)f=clamp(f,state.ott.x[0]+80,Math.min(5000,state.ott.x[2]-200));else f=clamp(f,state.ott.x[1]+200,18000);state.ott.x[dragXover]=f;sendParams();drawEQ();return}if(drag<0)return;const r=eqCanvas.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width),y=clamp(e.clientY-r.top,0,r.height);state.eq.freq[drag]=clamp(invLog(x/r.width),20,20000);state.eq.gain[drag]=clamp(18-(y/r.height)*36,-24,24);sendParams();drawEQ()});eqCanvas.addEventListener("pointerup",()=>{drag=-1;dragXover=-1});
function stopPlayback(){if(source){try{source.stop()}catch{}try{source.disconnect()}catch{}source=null}playing=false;$("#status").textContent="READY"}
async function loadAudioFile(file){if(!file)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();$("#status").textContent="DECODING…";audioBuffer=await audioCtx.decodeAudioData(await file.arrayBuffer());$("#fileName").textContent=file.name;$("#status").textContent="READY"}catch(e){$("#status").textContent="LOAD ERROR"}}
async function startPlayback(){if(!audioBuffer){$("#status").textContent="先 LOAD AUDIO";return}await ensureAudioGraph();await audioCtx.resume();stopPlayback();source=audioCtx.createBufferSource();source.buffer=audioBuffer;source.connect(workletNode);source.onended=()=>{playing=false;$("#status").textContent="READY"};source.start();playing=true;$("#status").textContent="PLAYING"}
$("#audioFileInput").addEventListener("change",e=>loadAudioFile(e.target.files[0]));$("#playBtn").onclick=()=>startPlayback().catch(()=>$("#status").textContent="PLAY ERROR");$("#stopBtn").onclick=stopPlayback;$("#resetBtn").onclick=()=>location.reload();
</script>
