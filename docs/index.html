eg));transform-origin:50% 25px;border-radius:2px}.dial:after{content:"";position:absolute;left:50%;top:8px;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}.knobTitle{height:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.knobValue{height:15px;line-height:13px;border:1px solid #050608;border-radius:3px;background:#07090b;color:#dce2e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px}

<script>
const $=s=>document.querySelector(s);let audioCtx=null,audioBuffer=null,source=null,workletNode=null,workletModuleUrl=null,playing=false;
const eqCanvas=$("#eqCanvas"),eqCtx=eqCanvas.getContext("2d");
const state={eq:{bypass:false,freq:[80,350,2500,10000],gain:[0,0,0,0],q:[.707,.707,.707,.707],color:35,hp:70},ott:{bypass:false,bandBypass:[false,false,false,false],degree:[100,100,100,100],liftT:[-40,-40,-40,-40],liftA:[50,50,50,50],liftR:[50,50,50,50],liftM:[100,100,100,100],compT:[-12,-12,-12,-12],compA:[15,15,15,15],compR:[60,60,60,60],compM:[100,100,100,100],level:[0,0,0,0],x:[350,1000,9000],input:5.2,gate:-80,mix:100,clip:true,output:-6},type:{bypass:false,bandBypass:[false,false,false,false],degree:[0,20,70,55],level:[0,0,1,1],attack:10,release:120,input:0,mix:100,output:0},de:{bypass:false,freq:12500,intensity:10,offset:0},mix:{bypass:false,drywet:100,output:0}};
const defaults=structuredClone(state),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=(v,d=1)=>Number(v).toFixed(d),logX=(hz,w)=>Math.log10(clamp(hz,20,20000)/20)/3*w,invLog=x=>20*Math.pow(1000,clamp(x,0,1));
const WORKLET_SOURCE="class VVChainWorklet extends AudioWorkletProcessor {\n  constructor(){\n    super();\n    this.ready=false; this.s=null;\n    this.N=8192;\n    this.frame=[new Float32Array(this.N),new Float32Array(this.N)];\n    this.fill=0;\n    this.queue=[new Float32Array(this.N*2),new Float32Array(this.N*2)];\n    this.qr=0; this.qw=0; this.qc=0;\n    this.ch=[this.makeCh(),this.makeCh()];\n    this.re=[new Float64Array(this.N),new Float64Array(this.N)];\n    this.im=[new Float64Array(this.N),new Float64Array(this.N)];\n    this.avgSum=0; this.avgCount=0; this.sampleParity=0; this.pending=0;\n    this.port.onmessage=e=>{\n      if(e.data && e.data.type===\"params\"){this.s=e.data.state;this.ready=true}\n    };\n  }\n  makeCh(){\n    return {\n      eq:Array.from({length:4},()=>({z1:0,z2:0})),\n      hp:{z1:0,z2:0}, lp:[0,0,0], gate:0, lim:0,\n      lift:[1,1,1,1], comp:[0,0,0,0], type:[0,0,0,0]\n    };\n  }\n  clamp(v,a,b){return Math.max(a,Math.min(b,v))}\n  finite(v){return Number.isFinite(v)?v:0}\n  db2g(db){return Math.pow(10,db/20)}\n  g2db(g){return 20*Math.log10(Math.max(g,1e-9))}\n  tc(ms){return Math.exp(-1/(.001*Math.max(.1,ms)*sampleRate))}\n  biquad(x,c,z){const y=c[0]*x+z.z1;z.z1=c[1]*x-c[3]*y+z.z2;z.z2=c[2]*x-c[4]*y;return y}\n  peak(fs,f,q,g){\n    const A=Math.pow(10,g/40),w=2*Math.PI*this.clamp(f,10,fs*.45)/fs;\n    const a=Math.sin(w)/(2*Math.max(.1,q)),cc=Math.cos(w);\n    const b0=1+a*A,b1=-2*cc,b2=1-a*A,a0=1+a/A,a1=-2*cc,a2=1-a/A;\n    return[b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]\n  }\n  hp(fs,f,q){\n    const w=2*Math.PI*this.clamp(f,10,fs*.45)/fs,a=Math.sin(w)/(2*Math.max(.1,q)),cc=Math.cos(w);\n    const b0=(1+cc)/2,b1=-(1+cc),b2=(1+cc)/2,a0=1+a,a1=-2*cc,a2=1-a;\n    return[b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]\n  }\n  color(x,a){\n    const d=1+1.35*a,z=x+.012*a*x*x,r=Math.tanh(d);\n    return r?Math.tanh(z*d)/r:x\n  }\n  fft(re,im,inv){\n    const n=re.length;\n    for(let i=1,j=0;i<n;i++){\n      let bit=n>>1;\n      for(;j&bit;bit>>=1)j^=bit;\n      j^=bit;\n      if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}\n    }\n    for(let len=2;len<=n;len<<=1){\n      const ang=(inv?1:-1)*2*Math.PI/len,wr0=Math.cos(ang),wi0=Math.sin(ang);\n      for(let i=0;i<n;i+=len){\n        let wr=1,wi=0;\n        for(let j=0;j<len/2;j++){\n          const k=i+j,l=k+len/2,tr=re[l]*wr-im[l]*wi,ti=re[l]*wi+im[l]*wr,ur=re[k],ui=im[k];\n          re[l]=ur-tr;im[l]=ui-ti;re[k]=ur+tr;im[k]=ui+ti;\n          const nwr=wr*wr0-wi*wi0,nwi=wr*wi0+wi*wr0;wr=nwr;wi=nwi\n        }\n      }\n    }\n    if(inv)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n}\n  }\n  updateAverage(x){\n    if(this.sampleParity===0)this.pending=x;\n    else{this.avgSum+=Math.abs(x-this.pending);this.avgCount++}\n    this.sampleParity^=1;\n  }\n  deesser(){\n    const s=this.s.de;\n    const avg=this.avgCount>0?this.avgSum/this.avgCount:0;\n    const threshold=avg+Number(s.offset||0);\n    const trigger=10;\n    for(let ch=0;ch<2;ch++){\n      const x=this.frame[ch],re=this.re[ch],im=this.im[ch];\n      let more=0;\n      for(let i=0;i<this.N-2;i+=2)if(Math.abs(x[i+1]-x[i])>threshold)more++;\n      for(let i=0;i<this.N;i++){re[i]=x[i];im[i]=0}\n      if(!s.bypass && more>trigger){\n        this.fft(re,im,false);\n        const ref=this.clamp(Number(s.freq||12500),6000,18000);\n        const intensity=this.clamp(Number(s.intensity||10),2,10);\n        for(let i=1;i<this.N/2;i++){\n          const f=44100*i/this.N;\n          const coeff=f<ref/10?.5:f>=ref?(intensity*ref/f):(1+(intensity-1)*Math.pow(f/ref,3));\n          re[i]/=coeff;im[i]/=coeff;re[this.N-i]/=coeff;im[this.N-i]/=coeff;\n        }\n        this.fft(re,im,true);\n      }\n      const q=this.queue[ch];\n      for(let i=0;i<this.N;i++)q[(this.qw+i)%q.length]=(!s.bypass&&more>trigger)?re[i]:x[i];\n    }\n    this.qw=(this.qw+this.N)%this.queue[0].length;\n    this.qc=Math.min(this.qc+this.N,this.queue[0].length);\n    this.fill=0;\n  }\n  sample(x,ch){\n    const s=this.s,c=this.ch[ch];let y=x;\n    if(!s.eq.bypass){\n      y=this.biquad(y,this.hp(sampleRate,s.eq.hp,.707),c.hp);\n      for(let b=0;b<4;b++){y=this.biquad(y,this.peak(sampleRate,s.eq.freq[b],s.eq.q[b],s.eq.gain[b]),c.eq[b]);y=this.color(y,.2+.8*s.eq.color/100)}\n    }\n    if(!s.ott.bypass){\n      const original=y,gdb=this.g2db(Math.abs(y)+1e-9),gt=s.ott.gate,gtarget=gdb<gt?(gdb-gt)*5:0;\n      c.gate=.99*c.gate+.01*gtarget;\n      let z=original*this.db2g(s.ott.input+c.gate),xs=s.ott.x;\n      c.lp[0]+=(1-Math.exp(-2*Math.PI*xs[0]/sampleRate))*(z-c.lp[0]);const h0=z-c.lp[0];\n      c.lp[1]+=(1-Math.exp(-2*Math.PI*xs[1]/sampleRate))*(h0-c.lp[1]);const h1=h0-c.lp[1];\n      c.lp[2]+=(1-Math.exp(-2*Math.PI*xs[2]/sampleRate))*(h1-c.lp[2]);\n      const bands=[c.lp[0],c.lp[1],c.lp[2],h1-c.lp[2]];let sum=0;\n      for(let b=0;b<4;b++){\n        let v=bands[b],db=this.g2db(Math.abs(v)+1e-9),boost=db<s.ott.liftT[b]?(s.ott.liftT[b]-db)*5/6:0;\n        boost=this.clamp(boost,0,30);\n        const la=this.tc(s.ott.liftA[b]),lr=this.tc(s.ott.liftR[b]);\n        c.lift[b]=c.lift[b]*(boost>0?la:lr)+(1-(boost>0?la:lr))*this.db2g(boost);\n        const lm=this.clamp(s.ott.liftM[b]*s.ott.degree[b]/100,0,100);\n        v*=c.lift[b]*lm/100+1-lm/100;\n        const ed=this.g2db(Math.abs(v)+1e-9),red=ed>s.ott.compT[b]?(ed-s.ott.compT[b])*7/8:0;\n        const ca=this.tc(s.ott.compA[b]),cr=this.tc(s.ott.compR[b]);\n        c.comp[b]=c.comp[b]*(red>0?ca:cr)+(1-(red>0?ca:cr))*red;\n        const cm=this.clamp(s.ott.compM[b]*s.ott.degree[b]/100,0,100);\n        v*=this.db2g(-c.comp[b])*cm/100+1-cm/100;\n        sum+=v*this.db2g(s.ott.level[b])\n      }\n      const sdb=this.g2db(Math.abs(sum)+1e-9),lred=sdb>-3?(sdb+3)*19/20:0;\n      c.lim=.995*c.lim+.005*lred;sum*=this.db2g(-c.lim);\n      if(s.ott.clip)sum=Math.tanh(sum*1.7);\n      y=(original*(1-s.ott.mix/100)+sum*s.ott.mix/100)*this.db2g(s.ott.output)\n    }\n    if(!s.type.bypass){\n      const ti=y*this.db2g(s.type.input),tb=[ti*.25,ti*.25,ti*.3,ti*.2];let enh=0;\n      for(let b=0;b<4;b++){\n        const ab=Math.abs(tb[b]),aa=this.tc(s.type.attack),rr=this.tc(s.type.release);\n        c.type[b]=c.type[b]*(ab>c.type[b]?aa:rr)+(1-(ab>c.type[b]?aa:rr))*ab;\n        const ldb=this.g2db(c.type[b]),boost=ldb<-40?this.clamp((-40-ldb)*.5*s.type.degree[b]/100,0,10):0;\n        enh+=tb[b]*(this.db2g(boost+s.type.level[b])-1)\n      }\n      y=(y+enh*s.type.mix/100)*this.db2g(s.type.output)\n    }\n    if(!s.type.bypass){\n      const avg=s.type.degree.reduce((a,v)=>a+Number(v||0),0)/400;\n      if(avg>0){\n        const drive=1+this.clamp(avg,0,1)*0.55;\n        const sat=Math.tanh(y*drive)/Math.tanh(drive);\n        y=y+(sat-y)*(.10+avg*.20);\n      }\n    }\n    return y\n  }\n  process(inputs,outputs){\n    const out=outputs[0],inp=inputs[0];\n    if(!this.ready||!this.s||!inp||!inp.length){for(const c of out)c.fill(0);return true}\n    const L=inp[0],R=inp[1]||inp[0],mix=this.clamp((this.s.mix.bypass?100:this.s.mix.drywet)/100,0,1),og=this.db2g(this.clamp(this.s.mix.output,-24,12));\n    for(let n=0;n<out[0].length;n++){\n      const l=L[n]||0,r=R[n]||0,pl=this.sample(l,0),pr=this.sample(r,1);\n      this.updateAverage(pl);\n      this.frame[0][this.fill]=pl;this.frame[1][this.fill]=pr;\n      let wL=0,wR=0;\n      if(this.qc>0){\n        wL=this.queue[0][this.qr];wR=this.queue[1][this.qr];\n        this.qr=(this.qr+1)%this.queue[0].length;this.qc--\n      }\n      if(this.fill===this.N-1)this.deesser();\n      this.fill=(this.fill+1)%this.N;\n      let yL=wL,yR=wR;\n      if(!this.s.mix.bypass){\n        yL=(l+mix*(wL-l))*og;\n        yR=(r+mix*(wR-r))*og;\n      }\n      out[0][n]=this.finite(yL);if(out[1])out[1][n]=this.finite(yR)\n    }\n    return true\n  }\n}\nregisterProcessor(\"vvchain-worklet\",VVChainWorklet);";
function makeWorkletUrl(){if(!workletModuleUrl)workletModuleUrl=URL.createObjectURL(new Blob([WORKLET_SOURCE],{type:"application/javascript"}));return workletModuleUrl}
async function ensureAudioGraph(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(!workletNode){await audioCtx.audioWorklet.addModule(makeWorkletUrl());workletNode=new AudioWorkletNode(audioCtx,"vvchain-worklet",{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});workletNode.connect(audioCtx.destination);workletNode.port.postMessage({type:"params",state})}}function sendParams(){if(workletNode)workletNode.port.postMessage({type:"params",state})}
function bypassLed(label,obj,accent){const box=document.createElement("div");box.className="ledBox";box.title=label+"：亮=運作，暗=BYPASS";const led=document.createElement("div");led.className="led";led.style.setProperty("--led",accent);const t=document.createElement("div");t.className="ledLabel";t.textContent=label;box.append(led,t);$("#leds").appendChild(box);const sync=()=>led.classList.toggle("on",!obj.bypass);box.onclick=()=>{obj.bypass=!obj.bypass;sync();sendParams()};sync()}
bypassLed("EQ",state.eq,"#38bdf8");bypassLed("OTT",state.ott,"#facc15");bypassLed("TAPE-A",state.type,"#f472b6");bypassLed("DE-ESS",state.de,"#67d3aa");bypassLed("MIX",state.mix,"#9ed85c");
$("#advPopupClose").onclick=()=>openAdvanced(-1);
const mixFader=$("#mixFader"),outFader=$("#outFader");function syncMini(){mixFader.value=state.mix.drywet;outFader.value=state.mix.output}mixFader.oninput=()=>{state.mix.drywet=Number(mixFader.value);sendParams()};outFader.oninput=()=>{state.mix.output=Number(outFader.value);sendParams()};syncMini();
function dialVisual(d,v,min,max,a){d.style.setProperty("--accent",a);d.style.setProperty("--angle",(-125+250*((v-min)/(max-min)))+"deg")}
function makeKnob(parent,cfg){const{label,get,set,min,max,suffix="",accent="#38bdf8",formatDigits=1,formatValue=null}=cfg;const w=document.createElement("div");w.className="knob";w.style.setProperty("--accent",accent);const d=document.createElement("div");d.className="dial";const t=document.createElement("div");t.className="knobTitle";t.textContent=label;const v=document.createElement("div");v.className="knobValue";w.append(d,t,v);parent.appendChild(w);const def=get(),render=()=>{const n=get();v.textContent=formatValue?formatValue(n):fmt(n,formatDigits)+suffix;dialVisual(d,n,min,max,accent)},apply=n=>{set(clamp(n,min,max));render();sendParams();drawEQ()};d.addEventListener("pointerdown",e=>{d.setPointerCapture(e.pointerId);const y=e.clientY,b=get(),mult=(max-min)/180,m=q=>apply(b+(y-q.clientY)*mult),u=()=>{d.removeEventListener("pointermove",m);d.removeEventListener("pointerup",u)};d.addEventListener("pointermove",m);d.addEventListener("pointerup",u)});d.addEventListener("dblclick",()=>apply(def));render()}
const cols=["#38bdf8","#22d3ee","#a3e635","#f97316"],bg=$("#bandGrid");
function hz(v){return v>=1000?fmt(v/1000,2)+" kHz":fmt(v,0)+" Hz"}function tape(v){return "+"+fmt(v*.06,1)+" dB"}
for(let b=0;b<4;b++){const n=b,card=document.createElement("div");card.className="band";card.style.setProperty("--accent",cols[n]);card.innerHTML="<div class='bandHead'><span>BAND "+(n+1)+"</span><button class='advBtn'>+ ADV</button></div><div class='bandBody'></div>";bg.appendChild(card);const body=card.querySelector(".bandBody"),g=document.createElement("div");
const ottLed=document.createElement("button");ottLed.className="bandLed ott";ottLed.style.setProperty("--led","#facc15");ottLed.title="BAND "+(n+1)+" OTT：亮=啟用；按下=BYPASS";ottLed.classList.toggle("on",!state.ott.bandBypass[n]);ottLed.onclick=()=>{state.ott.bandBypass[n]=!state.ott.bandBypass[n];ottLed.classList.toggle("on",!state.ott.bandBypass[n]);sendParams()};
const typeLed=document.createElement("button");typeLed.className="bandLed type";typeLed.style.setProperty("--led","#f472b6");typeLed.title="BAND "+(n+1)+" TYPE-A：亮=啟用；按下=BYPASS";typeLed.classList.toggle("on",!state.type.bandBypass[n]);typeLed.onclick=()=>{state.type.bandBypass[n]=!state.type.bandBypass[n];typeLed.classList.toggle("on",!state.type.bandBypass[n]);sendParams()};
card.append(ottLed,typeLed);g.className="knobGrid";body.appendChild(g);
makeKnob(g,{label:"FREQ",get:()=>state.eq.freq[n],set:v=>state.eq.freq[n]=v,min:20,max:20000,suffix:" Hz",accent:cols[n],formatDigits:0});
makeKnob(g,{label:"GAIN",get:()=>state.eq.gain[n],set:v=>state.eq.gain[n]=v,min:-24,max:24,suffix:" dB",accent:cols[n],formatDigits:1});
makeKnob(g,{label:"Q",get:()=>state.eq.q[n],set:v=>state.eq.q[n]=v,min:.1,max:18,accent:cols[n],formatDigits:2});
makeKnob(g,{label:"ANALOG COLOR",get:()=>state.eq.color,set:v=>state.eq.color=v,min:0,max:100,suffix:" %",accent:"#60a5fa"});
makeKnob(g,{label:"HP / CORNER",get:()=>state.eq.hp,set:v=>state.eq.hp=v,min:40,max:120,suffix:" Hz",accent:"#60a5fa",formatDigits:0});
makeKnob(g,{label:"OTT %",get:()=>state.ott.degree[n],set:v=>state.ott.degree[n]=v,min:0,max:100,suffix:" %",accent:"#facc15"});
makeKnob(g,{label:"ATTACK",get:()=>state.ott.compA[n],set:v=>state.ott.compA[n]=v,min:.1,max:250,suffix:" ms",accent:"#facc15",formatDigits:1});
makeKnob(g,{label:"RELEASE",get:()=>state.ott.compR[n],set:v=>state.ott.compR[n]=v,min:10,max:2500,suffix:" ms",accent:"#facc15",formatDigits:0});
makeKnob(g,{label:"TAPE-A +",get:()=>state.type.degree[n],set:v=>state.type.degree[n]=v,min:0,max:100,accent:cols[n],formatValue:tape});
if(n===3){body.classList.add("withDeess");const side=document.createElement("div");side.className="deessSide";body.appendChild(side);makeKnob(side,{label:"DE-ESS FREQ",get:()=>state.de.freq,set:v=>state.de.freq=v,min:6000,max:18000,suffix:" Hz",accent:"#67d3aa",formatValue:hz});makeKnob(side,{label:"DE-ESS %",get:()=>state.de.intensity,set:v=>state.de.intensity=v,min:2,max:10,suffix:" %",accent:"#67d3aa",formatDigits:2})}
card.querySelector(".advBtn").onclick=()=>openAdvanced(n)}
function buildAdvanced(b){const grid=$("#advPopupGrid");grid.innerHTML="";const mk=(label,key,min,max,suffix,d=1)=>({label,get:()=>state.ott[key][b],set:v=>state.ott[key][b]=v,min,max,suffix,accent:"#facc15",formatDigits:d});[mk("LIFT THRESH","liftT",-80,0," dB"),mk("LIFT ATT","liftA",1,500," ms"),mk("LIFT REL","liftR",10,2500," ms",0),mk("LIFT MIX","liftM",0,100," %"),mk("COMP THRESH","compT",-24,0," dB"),mk("COMP MIX","compM",0,100," %"),mk("BAND LEVEL","level",-24,12," dB"),{label:"XOVER 1",get:()=>state.ott.x[0],set:v=>state.ott.x[0]=v,min:80,max:600,suffix:" Hz",formatDigits:0,accent:"#facc15"},{label:"XOVER 2",get:()=>state.ott.x[1],set:v=>state.ott.x[1]=v,min:750,max:3000,suffix:" Hz",formatDigits:0,accent:"#facc15"},{label:"XOVER 3",get:()=>state.ott.x[2],set:v=>state.ott.x[2]=v,min:6000,max:12000,suffix:" Hz",formatDigits:0,accent:"#facc15"},{label:"INPUT",get:()=>state.ott.input,set:v=>state.ott.input=v,min:-24,max:24,suffix:" dB",accent:"#facc15"},{label:"GATE",get:()=>state.ott.gate,set:v=>state.ott.gate=v,min:-90,max:0,suffix:" dB",accent:"#facc15"},{label:"MASTER",get:()=>state.ott.mix,set:v=>state.ott.mix=v,min:0,max:100,suffix:" %",accent:"#facc15"},{label:"OUTPUT",get:()=>state.ott.output,set:v=>state.ott.output=v,min:-24,max:24,suffix:" dB",accent:"#facc15"}].forEach(c=>makeKnob(grid,c));const clip=document.createElement("button");clip.className="tiny";clip.textContent=state.ott.clip?"CLIP ON":"CLIP OFF";clip.onclick=()=>{state.ott.clip=!state.ott.clip;clip.textContent=state.ott.clip?"CLIP ON":"CLIP OFF";sendParams()};grid.appendChild(clip)}
function openAdvanced(b){const popup=$("#advPopup");if(b<0){popup.hidden=true;return}buildAdvanced(b);popup.hidden=false;$("#advPopupTitle").textContent="OTT ADVANCED · BAND "+(b+1)}
function resizeCanvas(){const r=eqCanvas.getBoundingClientRect(),d=devicePixelRatio||1;eqCanvas.width=Math.max(1,Math.round(r.width*d));eqCanvas.height=Math.max(1,Math.round(r.height*d));eqCtx.setTransform(d,0,0,d,0,0);drawEQ()}
function drawEQ(){const r=eqCanvas.getBoundingClientRect(),w=r.width,h=r.height;eqCtx.clearRect(0,0,w,h);eqCtx.fillStyle="#111318";eqCtx.fillRect(0,0,w,h);eqCtx.strokeStyle="#4b556044";for(let i=0;i<10;i++){const x=i*w/10;eqCtx.beginPath();eqCtx.moveTo(x,0);eqCtx.lineTo(x,h);eqCtx.stroke()}for(let i=0;i<=4;i++){const y=i*h/4;eqCtx.beginPath();eqCtx.moveTo(0,y);eqCtx.lineTo(w,y);eqCtx.stroke()}eqCtx.strokeStyle="#fff8";eqCtx.beginPath();eqCtx.moveTo(0,h/2);eqCtx.lineTo(w,h/2);eqCtx.stroke();eqCtx.strokeStyle="#fff";eqCtx.lineWidth=2;eqCtx.beginPath();for(let i=0;i<=240;i++){const x=i/240*w,hz=invLog(i/240);let db=0;for(let b=0;b<4;b++){const f=state.eq.freq[b],q=Math.max(.1,state.eq.q[b]),xx=Math.log(Math.max(hz,20)/Math.max(f,20)),wd=Math.max(.02,1/(q*1.8));db+=state.eq.gain[b]*Math.exp(-(xx*xx)/(2*wd*wd))}const y=h-(clamp(db,-18,18)+18)/36*h;i?eqCtx.lineTo(x,y):eqCtx.moveTo(x,y)}eqCtx.stroke();for(let b=0;b<4;b++){const x=logX(state.eq.freq[b],w),y=h-(clamp(state.eq.gain[b],-18,18)+18)/36*h;eqCtx.fillStyle=cols[b];eqCtx.beginPath();eqCtx.arc(x,y,6,0,Math.PI*2);eqCtx.fill()}}
resizeCanvas();window.addEventListener("resize",resizeCanvas);
let drag=-1;eqCanvas.addEventListener("pointerdown",e=>{const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(let b=0;b<4;b++){const px=logX(state.eq.freq[b],r.width),py=r.height-(clamp(state.eq.gain[b],-18,18)+18)/36*r.height;if(Math.hypot(px-x,py-y)<15){drag=b;eqCanvas.setPointerCapture(e.pointerId);break}}});eqCanvas.addEventListener("pointermove",e=>{if(drag<0)return;const r=eqCanvas.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width),y=clamp(e.clientY-r.top,0,r.height);state.eq.freq[drag]=clamp(invLog(x/r.width),20,20000);state.eq.gain[drag]=clamp(18-(y/r.height)*36,-24,24);sendParams();drawEQ()});eqCanvas.addEventListener("pointerup",()=>drag=-1);
function stopPlayback(){if(source){try{source.stop()}catch{}try{source.disconnect()}catch{}source=null}playing=false;$("#status").textContent="READY"}
async function loadAudioFile(file){if(!file)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();$("#status").textContent="DECODING…";audioBuffer=await audioCtx.decodeAudioData(await file.arrayBuffer());$("#fileName").textContent=file.name;$("#status").textContent="READY"}catch(e){$("#status").textContent="LOAD ERROR"}}
async function startPlayback(){if(!audioBuffer){$("#status").textContent="先 LOAD AUDIO";return}await ensureAudioGraph();await audioCtx.resume();stopPlayback();source=audioCtx.createBufferSource();source.buffer=audioBuffer;source.connect(workletNode);source.onended=()=>{playing=false;$("#status").textContent="READY"};source.start();playing=true;$("#status").textContent="PLAYING"}
$("#audioFileInput").addEventListener("change",e=>loadAudioFile(e.target.files[0]));$("#playBtn").onclick=()=>startPlayback().catch(()=>$("#status").textContent="PLAY ERROR");$("#stopBtn").onclick=stopPlayback;$("#resetBtn").onclick=()=>location.reload();
</script>
