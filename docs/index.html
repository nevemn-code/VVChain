<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VVChain — Audio Plugin Preview</title>
<style>
:root{--bg:#0d0e0d;--panel:#151713;--panel2:#1d1f1b;--line:#363933;--text:#e9e8e2;--muted:#a9aa9f;--accent:#d9caa0;--blue:#45aaf5;--teal:#38c8b6;--pink:#e55bd5;--green:#9ed85c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}
button,input{font:inherit}
button{color:var(--text);background:#292b26;border:1px solid #464941;border-radius:5px}
button:hover{background:#34372f}
button.active{background:#5c584c;border-color:#777060}
#app{min-height:100vh;display:flex;flex-direction:column}
.transport{position:sticky;top:0;z-index:20;background:#0a0b0a;border-bottom:1px solid var(--line);padding:8px 12px;display:grid;grid-template-columns:auto minmax(170px,1fr) auto auto auto auto auto auto auto auto;gap:7px;align-items:center}
.transport .file-name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.transport .range{display:flex;align-items:center;gap:5px;background:#191b17;border:1px solid var(--line);padding:4px 6px;border-radius:5px}
.transport .range label{font-size:10px;color:var(--muted)}
.transport input[type=range]{width:105px;accent-color:var(--accent)}
.transport .time{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:72px}
.transport .tiny{font-size:11px;padding:7px 9px}
.transport .loop{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.transport #loadBtn input{display:none}
.header{height:70px;background:#20221d;display:flex;align-items:center;padding:0 15px;gap:18px}
.brand{font-size:21px;font-weight:700;letter-spacing:.5px}
.brand small{font-size:10px;color:#aaa99d;display:block;margin-top:4px;font-weight:400}
.tabs{height:46px;background:#171915;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 10px}
.tabs button{font-size:12px;font-weight:700;letter-spacing:.4px}
.workspace{padding:10px;display:grid;grid-template-rows:minmax(360px,54vh) auto;gap:10px}
.graph-panel{position:relative;min-height:360px;background:#10120f;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#graph{width:100%;height:100%;display:block;cursor:crosshair}
.overlay{position:absolute;left:10px;top:8px;font-size:10px;color:#999b90;pointer-events:none}
.controls{background:#191a16;border:1px solid var(--line);border-radius:8px;padding:8px 8px 10px}
.band-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.band-row button{font-size:10px;padding:5px 10px}
.knob-grid{display:grid;grid-template-columns:repeat(9,minmax(84px,1fr));gap:7px}
.knob{min-height:94px;background:#141612;border:1px solid #30332d;border-radius:6px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.knob label{font-size:9px;color:#bfc0b6;text-align:center;min-height:18px}
.knob .dial{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#44473d,#1b1d18 66%,#10110f);border:2px solid #55584d;position:relative;touch-action:none;cursor:ns-resize}
.knob .dial::after{content:"";position:absolute;left:50%;top:6px;width:2px;height:17px;background:#d4cfbc;transform:translateX(-50%) rotate(var(--angle,-125deg));transform-origin:50% 18px;border-radius:2px}
.knob .value{font-size:9px;color:#dbd8cb;font-variant-numeric:tabular-nums;min-height:15px}
.switch{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.section-title{font-size:10px;color:#8f9189;margin:1px 0 6px;text-transform:uppercase;letter-spacing:.7px}
input[type=number],select{background:#10120f;color:#eee;border:1px solid #3a3d36;border-radius:4px;padding:4px}
.analyzer-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.analyzer-tools label{font-size:10px;color:var(--muted)}
#dropZone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8d9085;font-size:14px;pointer-events:none}
body.dragging #dropZone{display:flex;background:rgba(35,40,33,.62)}
@media(max-width:1100px){.transport{grid-template-columns:auto minmax(120px,1fr) auto auto auto auto}.transport .range{display:none}.knob-grid{grid-template-columns:repeat(6,minmax(84px,1fr))}}
@media(max-width:760px){.knob-grid{grid-template-columns:repeat(3,minmax(84px,1fr))}.workspace{grid-template-rows:380px auto}.tabs{grid-template-columns:repeat(3,1fr);height:auto}.transport{grid-template-columns:auto 1fr auto auto}.transport .loop{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="transport" id="transport">
    <label class="tiny" id="loadBtn"><input id="audioFileInput" type="file" accept="audio/*">LOAD AUDIO</label>
    <div class="file-name" id="fileName">未載入音檔</div>
    <div class="range"><label>START</label><input id="loopStart" type="range" min="0" max="1000" value="0"><span class="time" id="startTime">0:00.000</span></div>
    <div class="range"><label>END</label><input id="loopEnd" type="range" min="0" max="1000" value="1000"><span class="time" id="endTime">0:00.000</span></div>
    <label class="loop"><input id="loopToggle" type="checkbox" checked>LOOP</label>
    <button class="tiny" id="playBtn">PLAY</button>
    <button class="tiny" id="stopBtn">STOP</button>
    <button class="tiny" id="resetBtn">RESET</button>
    <span class="time" id="cursorTime">0:00.000</span>
    <span class="time" id="status">READY</span>
  </div>

  <div class="header">
    <div class="brand">VVChain<small>4-BAND ANALOG EQ · OTT · TYPE-A · DE-ESSER · FFT SPECTRUM</small></div>
  </div>

  <div class="tabs" id="functionTabs">
    <button data-module="0" class="active">EQ / ANALOG</button>
    <button data-module="1">OTT</button>
    <button data-module="2">TYPE-A</button>
    <button data-module="3">DE-ESSER</button>
    <button data-module="4">MIX / OUT</button>
    <button data-module="5">ANALYZER</button>
  </div>

  <div class="workspace">
    <div class="graph-panel">
      <canvas id="graph"></canvas>
      <div id="dropZone">拖曳音檔到這裡，或按上方 LOAD AUDIO</div>
      <div class="overlay" id="graphHint">滑鼠直接拖曳曲線／節點；雙擊旋鈕回預設</div>
    </div>
    <div class="controls" id="controls"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const graph=$('#graph'),ctx2=graph.getContext('2d');
let audioCtx=null,audioBuffer=null,processedBuffer=null,sourceNode=null,masterGain=null,analyser=null;
let playStartedAt=0,playOffset=0,raf=0,processTimer=0,dirty=false;
let moduleIndex=0,bandIndex=0;
const state={
  eq:{freq:[80,350,2500,10000],gain:[0,0,0,0],q:[.707,.707,.707,.707],color:35,hp:70},
  ott:{degree:[100,100,100,100],liftT:[-40,-40,-40,-40],liftA:[50,50,50,50],liftR:[50,50,50,50],liftM:[100,100,100,100],compT:[-12,-12,-12,-12],compA:[15,15,15,15],compR:[60,60,60,60],compM:[100,100,100,100],level:[0,0,0,0],x:[350,1000,9000],input:5.2,gate:-80,mix:100,clip:true,output:-6},
  type:{degree:[0,20,70,55],level:[0,0,1,1],attack:10,release:120,input:0,mix:100,output:0},
  de:{voice:0,intensity:10,offset:0},
  mix:{drywet:100,output:0}
};
const defaults=structuredClone(state);
const spectrum=new Float32Array(1024);
let waterfall=Array.from({length:60},()=>new Float32Array(256));
let peak=new Float32Array(256).fill(-120),smooth=new Float32Array(256).fill(-120);
let analyzerOpts={average:true,peak:true,persist:true,smoothing:true};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const db2g=db=>Math.pow(10,db/20);
const g2db=g=>20*Math.log10(Math.max(g,1e-9));
const fmt=(v,d=1)=>Number(v).toFixed(d);
const logX=(hz,w)=>Math.log10(clamp(hz,20,20000)/20)/3*w;
const invLog=x=>20*Math.pow(1000,clamp(x,0,1));
function resize(){const r=graph.getBoundingClientRect(),d=devicePixelRatio||1;graph.width=Math.max(1,Math.round(r.width*d));graph.height=Math.max(1,Math.round(r.height*d));ctx2.setTransform(d,0,0,d,0,0);draw();}
new ResizeObserver(resize).observe(graph);

function freqToX(hz,w){return logX(hz,w)}
function xToFreq(x,w){return invLog(x/w)}
function yFor(v,min,max,h){return h-(clamp(v,min,max)-min)/(max-min)*h}
function freqLabel(hz){return hz>=1000?fmt(hz/1000, hz<10000?1:0)+'k':fmt(hz,0)}

function canvasInfo(){const r=graph.getBoundingClientRect();return {w:r.width,h:r.height}}

function drawGrid(w,h,min=-18,max=18){
  ctx2.clearRect(0,0,w,h);ctx2.fillStyle='#10120f';ctx2.fillRect(0,0,w,h);
  ctx2.strokeStyle='#34372f';ctx2.lineWidth=1;
  for(let i=1;i<10;i++){const x=w*i/10;ctx2.beginPath();ctx2.moveTo(x,0);ctx2.lineTo(x,h);ctx2.stroke()}
  for(let i=0;i<=8;i++){const y=h*i/8;ctx2.beginPath();ctx2.moveTo(0,y);ctx2.lineTo(w,y);ctx2.stroke()}
  ctx2.fillStyle='#8f9188';ctx2.font='10px Segoe UI';
  for(const f of [20,50,100,200,500,1000,2000,5000,10000,20000]){
    const x=freqToX(f,w);ctx2.fillText(freqLabel(f),Math.max(2,Math.min(w-38,x-15)),h-7);
  }
  ctx2.fillStyle='#85877f';
  for(let i=0;i<=8;i++){const db=max-(max-min)*i/8;ctx2.fillText(fmt(db,0)+' dB',4,i*h/8+12)}
}
function node(x,y,c,selected=false){
  if(selected){ctx2.fillStyle=c+'30';ctx2.beginPath();ctx2.arc(x,y,15,0,Math.PI*2);ctx2.fill()}
  ctx2.fillStyle=c;ctx2.beginPath();ctx2.arc(x,y,6.5,0,Math.PI*2);ctx2.fill();ctx2.strokeStyle='#080908';ctx2.stroke();
}
function drawEQ(w,h){
  drawGrid(w,h,-18,18);
  const zero=yFor(0,-18,18,h);ctx2.strokeStyle='#aaa99d66';ctx2.beginPath();ctx2.moveTo(0,zero);ctx2.lineTo(w,zero);ctx2.stroke();
  ctx2.strokeStyle='#ded7c7';ctx2.lineWidth=2;ctx2.beginPath();
  for(let i=0;i<=320;i++){const x=i/320*w,hz=invLog(i/320),db=state.eq.gain.reduce((s,g,b)=>{const f=state.eq.freq[b],q=Math.max(.1,state.eq.q[b]),xx=Math.log(Math.max(hz,20)/Math.max(f,20)),width=Math.max(.02,1/(q*1.8));return s+g*Math.exp(-(xx*xx)/(2*width*width))},0);const y=yFor(db,-18,18,h);i?ctx2.lineTo(x,y):ctx2.moveTo(x,y)}
  ctx2.stroke();
  const cols=['#39a9ff','#35d0bf','#f05ce1','#9bde4d'];
  for(let b=0;b<4;b++)node(freqToX(state.eq.freq[b],w),yFor(state.eq.gain[b],-18,18,h),cols[b],b===bandIndex);
}
function drawOTT(w,h){
  drawGrid(w,h,0,100);const xs=state.ott.x,cols=['#39a9ff','#35d0bf','#f05ce1','#9bde4d'];
  xs.forEach(xv=>{const x=freqToX(xv,w);ctx2.strokeStyle='#eee8c577';ctx2.beginPath();ctx2.moveTo(x,0);ctx2.lineTo(x,h);ctx2.stroke();ctx2.fillStyle='#c9c4b7';ctx2.font='10px Segoe UI';ctx2.fillText(fmt(xv,0)+' Hz',Math.min(w-70,Math.max(2,x-30)),14)});
  const centers=[Math.sqrt(20*xs[0]),Math.sqrt(xs[0]*xs[1]),Math.sqrt(xs[1]*xs[2]),Math.sqrt(xs[2]*18000)];
  for(let b=0;b<4;b++){const y=yFor(state.ott.degree[b],0,100,h),left=b?xs[b-1]:20,right=b<3?xs[b]:18000;ctx2.strokeStyle=cols[b];ctx2.lineWidth=3;ctx2.beginPath();ctx2.moveTo(freqToX(left,w),y);ctx2.lineTo(freqToX(right,w),y);ctx2.stroke();node(freqToX(centers[b],w),y,cols[b],b===bandIndex)}
  ctx2.fillStyle='#e8e5dcaa';ctx2.font='11px Segoe UI';ctx2.fillText('GATE 6:1  →  LIFTER 6:1  →  COMPRESSOR 8:1  →  LIMITER',10,h-11)
}
function drawType(w,h){
  drawGrid(w,h,0,100);const xovers=[80,3000,9000],cols=['#39a9ff','#35d0bf','#f05ce1','#9bde4d'],centers=[40,700,5200,12000];
  xovers.forEach(f=>{const x=freqToX(f,w);ctx2.strokeStyle='#eee8c577';ctx2.beginPath();ctx2.moveTo(x,0);ctx2.lineTo(x,h);ctx2.stroke();ctx2.fillStyle='#c9c4b7';ctx2.font='10px Segoe UI';ctx2.fillText(fmt(f,0)+' Hz',Math.max(2,x-28),14)});
  centers.forEach((f,b)=>{const x=freqToX(f,w),y=yFor(state.type.degree[b],0,100,h);ctx2.strokeStyle=cols[b]+'a8';ctx2.lineWidth=3;ctx2.beginPath();ctx2.moveTo(x,h);ctx2.lineTo(x,y);ctx2.stroke();node(x,y,cols[b],true);ctx2.fillStyle=cols[b];ctx2.font='11px Segoe UI';ctx2.fillText('B'+(b+1)+' '+fmt(state.type.degree[b])+'%',Math.max(3,x-24),Math.max(28,y-10))});
  ctx2.fillStyle='#e8e5dcaa';ctx2.font='11px Segoe UI';ctx2.fillText('TYPE-A  ·  80 Hz LP  /  80 Hz–3 kHz  /  >3 kHz  /  >9 kHz',10,h-11)
}
function waveformFromBuffer(buffer,channel,rows=520){
  const data=buffer.getChannelData(Math.min(channel,buffer.numberOfChannels-1));const out=new Float32Array(rows);
  for(let i=0;i<rows;i++){const a=Math.floor(i*data.length/rows),b=Math.max(a+1,Math.floor((i+1)*data.length/rows));let peak=0;for(let j=a;j<b;j++)peak=Math.max(peak,Math.abs(data[j]));out[i]=peak}return out
}
function drawWave(r,arr,color){ctx2.strokeStyle=color;ctx2.lineWidth=1;ctx2.beginPath();for(let i=0;i<arr.length;i++){const x=r.x+i/(arr.length-1)*r.w;const y=r.y+r.h/2-arr[i]*r.h*.46;i?ctx2.lineTo(x,y):ctx2.moveTo(x,y)}ctx2.stroke()}
function drawDeEsser(w,h){
  ctx2.fillStyle='#0b0c0b';ctx2.fillRect(0,0,w,h);
  const top={x:10,y:8,w:w-20,h:h*.48},bot={x:10,y:h*.53,w:w-20,h:h*.42};
  ctx2.fillStyle='#181a17';ctx2.fillRect(top.x,top.y,top.w,top.h);
  let original=null,processed=null;
  if(audioBuffer){original=waveformFromBuffer(audioBuffer,0,Math.min(600,Math.max(150,Math.floor(w))));if(processedBuffer)processed=waveformFromBuffer(processedBuffer,0,original.length)}
  if(original)drawWave(top,original,'#d8d2c3');else{ctx2.fillStyle='#767a71';ctx2.font='11px Segoe UI';ctx2.fillText('LOAD AUDIO to preview ORIGINAL',top.x+10,top.y+20)}
  if(processed){ctx2.fillStyle='#121511';ctx2.fillRect(top.x,top.y+top.h*.5,top.w,top.h*.5);drawWave({x:top.x,y:top.y+top.h*.5,w:top.w,h:top.h*.5},processed,'#64c9a7')}
  ctx2.fillStyle='#e7e4da';ctx2.font='11px Segoe UI';ctx2.fillText('ORIGINAL',top.x+8,top.y+15);ctx2.fillStyle='#64c9a7';ctx2.fillText('PROCESSED',top.x+8,top.y+top.h*.5+15);
  const target=state.de.voice===0?12500:13500;const lx=freqToX(target/10,w),hx=freqToX(target,w);ctx2.fillStyle='#c7bca62b';ctx2.fillRect(lx,top.y,Math.max(2,hx-lx),top.h);
  ctx2.strokeStyle='#eee8c677';[lx,hx].forEach(x=>{ctx2.beginPath();ctx2.moveTo(x,top.y);ctx2.lineTo(x,top.y+top.h);ctx2.stroke()});
  ctx2.fillStyle='#c8c8bf';ctx2.font='11px Segoe UI';ctx2.fillText('REFERENCE: 44100 Hz · 8192 FFT · FILTER → IFFT',14,bot.y+18);
  const cx1=bot.w*.28+bot.x,cx2=bot.w*.63+bot.x,iy=bot.y+bot.h*.43;
  node(cx1,yFor((state.de.intensity-2)/8*100,0,100,bot.h)+bot.y, '#e55bd5',true);
  node(cx2+(state.de.offset*180),iy,'#45aaf5',true);
  ctx2.fillStyle='#e9e8e2';ctx2.fillText('INTENSITY '+fmt(state.de.intensity,2),cx1-60,bot.y+bot.h*.72);ctx2.fillText('AVERAGE OFFSET '+fmt(state.de.offset,3),cx2-75,bot.y+bot.h*.72);
  ctx2.fillStyle='#9c9e94';ctx2.fillText(state.de.voice===0?'MALE VOCAL':'FEMALE VOCAL',bot.x+8,bot.y+bot.h-10);
}
function drawMix(w,h){
  drawGrid(w,h,0,100);const x1=w*.35,x2=w*.65,d=state.mix.drywet,o=(state.mix.output+24)/36*100;ctx2.strokeStyle='#45aaf5aa';ctx2.beginPath();ctx2.moveTo(x1,0);ctx2.lineTo(x1,h);ctx2.stroke();ctx2.strokeStyle='#9ed85caa';ctx2.beginPath();ctx2.moveTo(x2,0);ctx2.lineTo(x2,h);ctx2.stroke();node(x1,yFor(d,0,100,h),'#45aaf5',true);node(x2,yFor(o,0,100,h),'#9ed85c',true);ctx2.fillStyle='#ddd';ctx2.font='11px Segoe UI';ctx2.fillText('DRY / WET',x1-35,18);ctx2.fillText('OUTPUT',x2-25,18)}
function drawAnalyzer(w,h){
  const topH=h*.62,waterH=h-topH-5;drawGrid(w,topH,-100,6);
  const vals=new Float32Array(256);for(let i=0;i<256;i++){const hz=invLog(i/255),bin=clamp(Math.floor(hz/(audioCtx?audioCtx.sampleRate:48000)*2*(1023)),1,1023);let v=spectrum[bin]||-120;if(analyzerOpts.smoothing&&i>0&&i<255){const b0=clamp(bin-1,1,1023),b1=clamp(bin+1,1,1023);v=(spectrum[b0]+spectrum[bin]+spectrum[b1])/3}vals[i]=analyzerOpts.average?(smooth[i]*.78+v*.22):v;smooth[i]=vals[i];if(analyzerOpts.peak)peak[i]=Math.max(peak[i]-0.2,v)}
  ctx2.strokeStyle='#e3d8b6';ctx2.lineWidth=1.8;ctx2.beginPath();for(let i=0;i<256;i++){const x=freqToX(invLog(i/255),w),y=yFor(vals[i],-100,6,topH);i?ctx2.lineTo(x,y):ctx2.moveTo(x,y)}ctx2.stroke();
  if(analyzerOpts.peak){ctx2.strokeStyle='#8da1ff99';ctx2.lineWidth=1;ctx2.beginPath();for(let i=0;i<256;i++){const x=freqToX(invLog(i/255),w),y=yFor(peak[i],-100,6,topH);i?ctx2.lineTo(x,y):ctx2.moveTo(x,y)}ctx2.stroke()}
  const sy=topH+5;ctx2.fillStyle='#0b0d0b';ctx2.fillRect(0,sy,w,waterH);
  for(let r=0;r<waterfall.length;r++){const yy=sy+r*waterH/waterfall.length,row=waterfall[r];for(let c=0;c<256;c++){const n=clamp((row[c]+100)/100,0,1);ctx2.fillStyle='hsl('+(245-200*n)+' '+Math.round(60+30*n)+'% '+Math.round(8+55*n)+'%)';ctx2.fillRect(c*w/256,yy,w/256+1,waterH/waterfall.length+1)}}
  ctx2.fillStyle='#ddd';ctx2.font='11px Segoe UI';ctx2.fillText('FFT SPECTRUM',8,16);ctx2.fillText('WATERFALL',8,sy+16)
}
function draw(){const {w,h}=canvasInfo();if(moduleIndex===0)drawEQ(w,h);else if(moduleIndex===1)drawOTT(w,h);else if(moduleIndex===2)drawType(w,h);else if(moduleIndex===3)drawDeEsser(w,h);else if(moduleIndex===4)drawMix(w,h);else drawAnalyzer(w,h)}

const controlDefs={
  eq:[
    ['freq','FREQUENCY',20,20000,1,'Hz'],['gain','GAIN',-24,24,.1,'dB'],['q','Q',.1,18,.01,''],
    ['color','ANALOG COLOR',0,100,.1,'%'],['hp','HP / CORNER',40,120,1,'Hz']
  ],
  ott:[
    ['degree','DEGREE',0,100,.1,'%'],['liftT','LIFTER THRESH',-80,0,.1,' dB'],['liftA','LIFTER ATT',1,500,.1,' ms'],
    ['liftR','LIFTER REL',10,2500,1,' ms'],['liftM','LIFTER MIX',0,100,.1,'%'],['compT','COMP THRESH',-24,0,.1,' dB'],
    ['compA','COMP ATT',.1,250,.1,' ms'],['compR','COMP REL',10,2500,1,' ms'],['compM','COMP MIX',0,100,.1,'%'],['level','BAND LEVEL',-24,12,.1,' dB'],
    ['x1','XOVER 1',80,600,1,' Hz'],['x2','XOVER 2',750,3000,1,' Hz'],['x3','XOVER 3',6000,12000,1,' Hz'],
    ['input','INPUT',-24,24,.1,' dB'],['gate','GATE',-90,0,.1,' dB'],['mix','MASTER MIX',0,100,.1,'%'],['output','OUTPUT',-24,24,.1,' dB']
  ],
  type:[
    ['degree','TYPE-A B1',0,100,.1,'%'],['degree2','TYPE-A B2',0,100,.1,'%'],['degree3','TYPE-A B3',0,100,.1,'%'],['degree4','TYPE-A B4',0,100,.1,'%'],
    ['attack','ATTACK',1,100,.1,' ms'],['release','RELEASE',20,500,1,' ms'],['input','INPUT',-24,24,.1,' dB'],['mix','MIX',0,100,.1,'%'],['output','OUTPUT',-24,24,.1,' dB']
  ],
  de:[
    ['voice','VOICE',0,1,1,''],['intensity','INTENSITY',2,10,.01,''],['offset','AVERAGE OFFSET',-.1,.1,.001,'']
  ],
  mix:[['drywet','DRY / WET',0,100,.1,'%'],['output','OUTPUT',-24,12,.1,' dB']]
};

function stateGet(key){
  if(moduleIndex===0){if(key==='freq'||key==='gain'||key==='q')return state.eq[key][bandIndex];return state.eq[key]}
  if(moduleIndex===1){if(['degree','liftT','liftA','liftR','liftM','compT','compA','compR','compM','level'].includes(key))return state.ott[['degree','liftT','liftA','liftR','liftM','compT','compA','compR','compM','level'].includes(key)?key:key][bandIndex];return state.ott[key]}
  if(moduleIndex===2){if(key==='degree')return state.type.degree[0];if(key==='degree2')return state.type.degree[1];if(key==='degree3')return state.type.degree[2];if(key==='degree4')return state.type.degree[3];return state.type[key]}
  if(moduleIndex===3)return state.de[key];
  return state.mix[key]
}
function stateSet(key,v){
  if(moduleIndex===0){if(key==='freq'||key==='gain'||key==='q')state.eq[key][bandIndex]=v;else state.eq[key]=v}
  else if(moduleIndex===1){if(['degree','liftT','liftA','liftR','liftM','compT','compA','compR','compM','level'].includes(key))state.ott[key][bandIndex]=v;else state.ott[key]=v}
  else if(moduleIndex===2){if(key==='degree')state.type.degree[0]=v;else if(key==='degree2')state.type.degree[1]=v;else if(key==='degree3')state.type.degree[2]=v;else if(key==='degree4')state.type.degree[3]=v;else state.type[key]=v}
  else if(moduleIndex===3)state.de[key]=v; else state.mix[key]=v;
}

function renderControls(){
  const box=$('#controls');box.innerHTML='';
  if(moduleIndex<=2){const row=document.createElement('div');row.className='band-row';for(let i=0;i<4;i++){const b=document.createElement('button');b.textContent='BAND '+(i+1);b.className=i===bandIndex?'active':'';b.onclick=()=>{bandIndex=i;renderControls();draw()};row.appendChild(b)}box.appendChild(row)}
  if(moduleIndex===5){const tools=document.createElement('div');tools.className='analyzer-tools';[['Average','average'],['Max Hold','peak'],['Persistence','persist'],['Smoothing','smoothing']].forEach(([t,k])=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox" '+(analyzerOpts[k]?'checked':'')+'> '+t;l.firstChild.onchange=e=>{analyzerOpts[k]=e.target.checked;if(!e.target.checked&&k==='peak')peak.fill(-120);draw()};tools.appendChild(l)});box.appendChild(tools);return}
  const defs=moduleIndex===0?controlDefs.eq:moduleIndex===1?controlDefs.ott:moduleIndex===2?controlDefs.type:moduleIndex===3?controlDefs.de:controlDefs.mix;
  const grid=document.createElement('div');grid.className='knob-grid';
  defs.forEach((def,idx)=>{
    const [key,title,min,max,step,suf]=def;const k=document.createElement('div');k.className='knob';
    const l=document.createElement('label');l.textContent=title;k.appendChild(l);
    const d=document.createElement('div');d.className='dial';
    const val=document.createElement('div');val.className='value';k.appendChild(d);k.appendChild(val);
    const get=()=>stateGet(key);const set=v=>{stateSet(key,clamp(v,min,max));val.textContent=(moduleIndex===3&&key==='voice')?(state.de.voice?'Female Vocal':'Male Vocal'):fmt(get(),key==='offset'?3:(max-min>500?0:1))+suf;updateDial(d,get(),min,max);scheduleProcess()};
    const update=()=>{const v=get();val.textContent=(moduleIndex===3&&key==='voice')?(state.de.voice?'Female Vocal':'Male Vocal'):fmt(v,key==='offset'?3:(max-min>500?0:1))+suf;updateDial(d,v,min,max)}
    d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);const start=e.clientY,base=get();const mult=(max-min)/180;const move=q=>set(base+(start-q.clientY)*mult);const up=()=>{d.removeEventListener('pointermove',move);d.removeEventListener('pointerup',up)};d.addEventListener('pointermove',move);d.addEventListener('pointerup',up)});
    d.addEventListener('dblclick',()=>{const defs0=defaults[moduleIndex===0?'eq':moduleIndex===1?'ott':moduleIndex===2?'type':moduleIndex===3?'de':'mix'];let dv=undefined; if(moduleIndex===0){if(['freq','gain','q'].includes(key))dv=defaults.eq[key][bandIndex];else dv=defaults.eq[key]}else if(moduleIndex===1){if(['degree','liftT','liftA','liftR','liftM','compT','compA','compR','compM','level'].includes(key))dv=defaults.ott[key][bandIndex];else dv=defaults.ott[key]}else if(moduleIndex===2){dv=key==='degree'?defaults.type.degree[0]:key==='degree2'?defaults.type.degree[1]:key==='degree3'?defaults.type.degree[2]:key==='degree4'?defaults.type.degree[3]:defaults.type[key]}else if(moduleIndex===3)dv=defaults.de[key];else dv=defaults.mix[key]; if(dv!==undefined)set(dv)});
    if(moduleIndex===3&&key==='voice'){d.style.display='none';const sel=document.createElement('select');sel.innerHTML='<option value="0">Male Vocal</option><option value="1">Female Vocal</option>';sel.value=state.de.voice;sel.onchange=e=>{state.de.voice=+e.target.value;draw();scheduleProcess()};k.replaceChild(sel,d);update=()=>{sel.value=state.de.voice};}
    k._update=update;grid.appendChild(k);update();
  });box.appendChild(grid);
  if(moduleIndex===1){const s=document.createElement('div');s.className='switch';s.style.marginTop='8px';s.innerHTML='<input type="checkbox" id="clipSwitch" '+(state.ott.clip?'checked':'')+'> OTT CLIPPER';s.firstChild.onchange=e=>{state.ott.clip=e.target.checked;scheduleProcess()};box.appendChild(s)}
}

function updateDial(d,v,min,max){const t=(v-min)/(max-min);d.style.setProperty('--angle',(-125+250*t)+'deg')}

document.querySelectorAll('#functionTabs button').forEach(b=>b.onclick=()=>{moduleIndex=+b.dataset.module;document.querySelectorAll('#functionTabs button').forEach(x=>x.classList.toggle('active',x===b));renderControls();draw()});

function biquadPeak(fs,f0,gain,q){const A=Math.pow(10,gain/40),w=2*Math.PI*f0/fs,alpha=Math.sin(w)/(2*q),c=Math.cos(w),b0=1+alpha*A,b1=-2*c,b2=1-alpha*A,a0=1+alpha/A,a1=-2*c,a2=1-alpha/A;return [b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]}
function biquadHP(fs,f0,q=.707){const w=2*Math.PI*f0/fs,alpha=Math.sin(w)/(2*q),c=Math.cos(w),b0=(1+c)/2,b1=-(1+c),b2=(1+c)/2,a0=1+alpha,a1=-2*c,a2=1-alpha;return [b0/a0,b1/a0,b2/a0,a1/a0,a2/a0]}
function applyBq(x,bq,z){const y=bq[0]*x+z.z1;z.z1=bq[1]*x-bq[3]*y+z.z2;z.z2=bq[2]*x-bq[4]*y;return y}
function color(x,a){const d=1+1.35*clamp(a,0,1),z=x+.012*clamp(a,0,1)*x*x,r=Math.tanh(d);return Math.tanh(z*d)/r}
function processEqChannel(data,fs){const hp=biquadHP(fs,state.eq.hp);const bands=state.eq.freq.map((f,i)=>biquadPeak(fs,f,state.eq.gain[i],state.eq.q[i]));const zs=bands.map(()=>({z1:0,z2:0}));const zh={z1:0,z2:0};for(let n=0;n<data.length;n++){let y=applyBq(data[n],hp,zh);for(let i=0;i<4;i++){y=applyBq(y,bands[i],zs[i]);y=color(y,.2+.8*state.eq.color/100)}data[n]=y}}
function processOttChannel(data,fs){
  const xs=state.ott.x;const split=b=>{const c=2*Math.PI*b/fs;const a=1-Math.exp(-c);return a};const al=xs.map(split);
  let lp=[0,0,0],lev=[1,1,1,1],comp=[0,0,0,0],gate=0,lim=0;
  for(let n=0;n<data.length;n++){
    const original=data[n],gdb=g2db(Math.max(Math.abs(original),1e-6));const gt=state.ott.gate,gd=gdb<gt?(gdb-gt)*5:0;gate=gate*.99+gd*.01;let x=original*db2g(state.ott.input+gate);
    lp[0]+=al[0]*(x-lp[0]);const h0=x-lp[0];lp[1]+=al[1]*(h0-lp[1]);const h1=h0-lp[1];lp[2]+=al[2]*(h1-lp[2]);const bands=[lp[0],lp[1],lp[2],h1-lp[2]];
    let y=0;for(let b=0;b<4;b++){let z=bands[b];const aa=Math.exp(-1/(.001*Math.max(1,state.ott.liftA[b])*fs)),rr=Math.exp(-1/(.001*Math.max(10,state.ott.liftR[b])*fs));const db=g2db(Math.max(Math.abs(z),1e-5));let boost=db<state.ott.liftT[b]?(state.ott.liftT[b]-db)*(1-1/6):0;boost=clamp(boost,0,30);lev[b]=lev[b]* (boost>0?aa:rr)+(1-(boost>0?aa:rr))*db2g(boost);z=z*(lev[b]*(state.ott.liftM[b]*state.ott.degree[b]/100)/100+1-state.ott.liftM[b]*state.ott.degree[b]/10000);
      const ac=Math.exp(-1/(.001*Math.max(.1,state.ott.compA[b])*fs)),rc=Math.exp(-1/(.001*Math.max(10,state.ott.compR[b])*fs));const ed=g2db(Math.max(Math.abs(z),1e-5)),red=ed>state.ott.compT[b]?(ed-state.ott.compT[b])*(1-1/8):0;comp[b]=comp[b]*(red>0?ac:rc)+(1-(red>0?ac:rc))*red;const cm=state.ott.compM[b]*state.ott.degree[b]/100;z=z*(db2g(-comp[b])*cm/100+1-cm/100);y+=z*db2g(state.ott.level[b])}
    const er=g2db(Math.max(Math.abs(y),1e-5));const red=er>-3?(er+3)*(1-1/20):0;lim=lim*.995+red*.005;y*=db2g(-lim);if(state.ott.clip)y=Math.tanh(y*1.7);data[n]=(original+(y-original)*state.ott.mix/100)*db2g(state.ott.output)
  }
}
function processTypeChannel(data,fs){let e=new Array(4).fill(0);const a=Math.exp(-1/(.001*state.type.attack*fs)),r=Math.exp(-1/(.001*state.type.release*fs));for(let n=0;n<data.length;n++){const x=data[n]*db2g(state.type.input),b=[x*.25,x*.25,x*.3,x*.2];let en=0;for(let i=0;i<4;i++){const ab=Math.abs(b[i]);e[i]=e[i]*(ab>e[i]?a:r)+(1-(ab>e[i]?a:r))*ab;const db=g2db(Math.max(e[i],1e-6));const boost=db<-40?clamp((-40-db)*.5*state.type.degree[i]/100,0,10):0;en+=b[i]*(db2g(boost+state.type.level[i])-1)}data[n]=(x/db2g(state.type.input)+en*state.type.mix/100)*db2g(state.type.output)}}

function fft(re,im,inverse){const n=re.length;for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}for(let len=2;len<=n;len<<=1){const ang=(inverse?1:-1)*2*Math.PI/len,wr0=Math.cos(ang),wi0=Math.sin(ang);for(let i=0;i<n;i+=len){let wr=1,wi=0;for(let j=0;j<len/2;j++){const k=i+j,l=k+len/2,tr=re[l]*wr-im[l]*wi,ti=re[l]*wi+im[l]*wr;re[l]=re[k]-tr;im[l]=im[k]-ti;re[k]+=tr;im[k]+=ti;const nwr=wr*wr0-wi*wi0,nwi=wr*wi0+wi*wr0;wr=nwr;wi=nwi}}}if(inverse)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n}}
function deesserChannel(data){const N=8192,out=new Float32Array(data.length);const target=state.de.voice===0?12500:13500;for(let base=0;base<data.length;base+=N){const count=Math.min(N,data.length-base),x=new Float64Array(N);for(let i=0;i<count;i++)x[i]=data[base+i];let sum=0;for(let i=0;i<N-1;i++)sum+=Math.abs(x[i+1]-x[i]);const avg=sum/(N/2)+state.de.offset;let more=0;for(let i=0;i<N-1;i++)if(Math.abs(x[i+1]-x[i])>avg)more++;if(more>10){const re=x,im=new Float64Array(N);fft(re,im,false);for(let i=1;i<N/2;i++){const freq=44100*i/N;let coeff;if(freq<target/10)coeff=.5;else if(freq>=target)coeff=state.de.intensity*target/freq;else coeff=1+(state.de.intensity-1)*Math.pow(freq/target,3);re[i]/=coeff;im[i]/=coeff;re[N-i]/=coeff;im[N-i]/=coeff}fft(re,im,true);for(let i=0;i<N;i++)out[base+i]=re[i]}else{for(let i=0;i<N;i++)out[base+i]=x[i]}}
return out}
async function processBuffer(buffer){const n=buffer.length,channels=[];for(let c=0;c<buffer.numberOfChannels;c++)channels.push(new Float32Array(buffer.getChannelData(c)));const fs=buffer.sampleRate;for(let c=0;c<channels.length;c++){processEqChannel(channels[c],fs);processOttChannel(channels[c],fs);processTypeChannel(channels[c],fs);channels[c]=deesserChannel(channels[c])}const mix=state.mix.drywet/100,out=new AudioBuffer({length:n,numberOfChannels:buffer.numberOfChannels,sampleRate:fs});for(let c=0;c<channels.length;c++){const dry=buffer.getChannelData(c),wet=channels[c],dst=out.getChannelData(c),og=db2g(state.mix.output);for(let i=0;i<n;i++)dst[i]=(dry[i]+(wet[i]-dry[i])*mix)*og}return out}

async function scheduleProcess(){dirty=true;clearTimeout(processTimer);processTimer=setTimeout(async()=>{if(!audioBuffer)return;dirty=false;$('#status').textContent='PROCESSING…';try{processedBuffer=await processBuffer(audioBuffer);$('#status').textContent='READY'}catch(e){console.error(e);$('#status').textContent='DSP ERROR'}draw()},120)}
function loadAudioFile(file){if(!file)return;$('#status').textContent='DECODING…';const reader=new FileReader();reader.onload=async()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioBuffer=await audioCtx.decodeAudioData(reader.result);processedBuffer=null;$('#fileName').textContent=file.name;$('#endTime').textContent=secToTime(audioBuffer.duration);$('#loopStart').value=0;$('#loopEnd').value=1000;$('#status').textContent='PROCESSING…';await scheduleProcess();$('#status').textContent='READY';updateRangeLabels()}catch(e){console.error(e);$('#status').textContent='LOAD ERROR'}};reader.readAsArrayBuffer(file)}
function secToTime(t){t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+String(Math.floor((t%1)*1000)).padStart(3,'0')}
function updateRangeLabels(){if(!audioBuffer)return;const a=+$('#loopStart').value/1000*audioBuffer.duration,b=+$('#loopEnd').value/1000*audioBuffer.duration;$('#startTime').textContent=secToTime(a);$('#endTime').textContent=secToTime(b)}
$('#audioFileInput').onchange=e=>loadAudioFile(e.target.files[0]);
['loopStart','loopEnd'].forEach(id=>$('#'+id).oninput=()=>{if(+$('#loopStart').value>=+$('#loopEnd').value){if(id==='loopStart')$('#loopStart').value=+$('#loopEnd').value-1;else $('#loopEnd').value=+$('#loopStart').value+1}updateRangeLabels()});
function stopPlayback(){if(sourceNode){try{sourceNode.stop()}catch{}sourceNode.disconnect();sourceNode=null}cancelAnimationFrame(raf)}
$('#playBtn').onclick=async()=>{if(!audioBuffer)return;await audioCtx.resume();stopPlayback();const start=+$('#loopStart').value/1000*audioBuffer.duration,end=+$('#loopEnd').value/1000*audioBuffer.duration;if(!processedBuffer)processedBuffer=await processBuffer(audioBuffer);sourceNode=audioCtx.createBufferSource();sourceNode.buffer=processedBuffer;analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.7;masterGain=audioCtx.createGain();sourceNode.connect(analyser).connect(masterGain).connect(audioCtx.destination);playStartedAt=audioCtx.currentTime;playOffset=start;sourceNode.onended=()=>{if($('#loopToggle').checked&&sourceNode){playOffset=start;$('#playBtn').click()}};sourceNode.start(0,start,Math.max(.001,end-start));animatePlayback(end)});
$('#stopBtn').onclick=()=>stopPlayback();
$('#resetBtn').onclick=()=>{Object.assign(state,structuredClone(defaults));renderControls();draw();scheduleProcess()};
function animatePlayback(end){cancelAnimationFrame(raf);const tick=()=>{if(!sourceNode)return;const t=playOffset+(audioCtx.currentTime-playStartedAt);$('#cursorTime').textContent=secToTime(Math.min(t,end));if(t<end)raf=requestAnimationFrame(tick)};tick()}
['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add('dragging')}));
['dragleave','drop'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();document.body.classList.remove('dragging')}));
window.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadAudioFile(f)});
setInterval(()=>{if(moduleIndex!==5||!analyser)return;const arr=new Float32Array(analyser.frequencyBinCount);analyser.getFloatFrequencyData(arr);for(let i=0;i<1024;i++)spectrum[i]=i<arr.length?arr[i]:-120;const row=waterfall[0];for(let i=0;i<256;i++){const bin=clamp(Math.floor(i/255*(arr.length-1)),0,arr.length-1);row[i]=arr[bin]||-120}for(let r=waterfall.length-1;r>0;r--)waterfall[r].set(waterfall[r-1]);draw()},50);

let drag={kind:null};
graph.addEventListener('pointerdown',e=>{const {w,h}=canvasInfo();const r=graph.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(moduleIndex===0){let best=18;for(let b=0;b<4;b++){const px=freqToX(state.eq.freq[b],w),py=yFor(state.eq.gain[b],-18,18,h),d=Math.hypot(px-x,py-y);if(d<best){best=d;drag={kind:'eq',b}}}}
 else if(moduleIndex===1){for(let i=0;i<3;i++){const px=freqToX(state.ott.x[i],w);if(Math.abs(px-x)<12){drag={kind:'ottx',i};break}}if(!drag.kind){let best=22;const xs=state.ott.x,c=[Math.sqrt(20*xs[0]),Math.sqrt(xs[0]*xs[1]),Math.sqrt(xs[1]*xs[2]),Math.sqrt(xs[2]*18000)];for(let b=0;b<4;b++){const px=freqToX(c[b],w),py=yFor(state.ott.degree[b],0,100,h),d=Math.hypot(px-x,py-y);if(d<best){best=d;drag={kind:'ottd',b}}}}}
 else if(moduleIndex===2){const c=[40,700,5200,12000];let best=24;for(let b=0;b<4;b++){const px=freqToX(c[b],w),py=yFor(state.type.degree[b],0,100,h),d=Math.hypot(px-x,py-y);if(d<best){best=d;drag={kind:'typed',b}}}}
 else if(moduleIndex===3){const cx1=w*.28,cy1=yFor((state.de.intensity-2)/8*100,0,100,h),cx2=w*.63+state.de.offset*180,cy2=h*.53*.43; if(Math.hypot(cx1-x,cy1-y)<25)drag={kind:'dei'};else if(Math.hypot(cx2-x,cy2-y)<25)drag={kind:'deo'}}
 else if(moduleIndex===4){const x1=w*.35,x2=w*.65;if(Math.hypot(x1-x,yFor(state.mix.drywet,0,100,h)-y)<25)drag={kind:'dry'};else if(Math.hypot(x2-x,yFor((state.mix.output+24)/36*100,0,100,h)-y)<25)drag={kind:'out'}}
 if(drag.kind){graph.setPointerCapture(e.pointerId);e.preventDefault()}});
graph.addEventListener('pointermove',e=>{if(!drag.kind)return;const {w,h}=canvasInfo(),r=graph.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(drag.kind==='eq'){state.eq.freq[drag.b]=clamp(xToFreq(x,w),20,20000);state.eq.gain[drag.b]=clamp((1-y/h)*36-18,-24,24)}
 if(drag.kind==='ottd')state.ott.degree[drag.b]=clamp((1-y/h)*100,0,100);
 if(drag.kind==='ottx'){const f=xToFreq(x,w);if(drag.i===0)state.ott.x[0]=clamp(f,80,600);if(drag.i===1)state.ott.x[1]=clamp(f,Math.max(750,state.ott.x[0]+80),3000);if(drag.i===2)state.ott.x[2]=clamp(f,Math.max(6000,state.ott.x[1]+200),12000)}
 if(drag.kind==='typed')state.type.degree[drag.b]=clamp((1-y/h)*100,0,100);
 if(drag.kind==='dei')state.de.intensity=clamp(2+(1-y/h)*8,2,10);
 if(drag.kind==='deo')state.de.offset=clamp((x-w*.63)/180,-.1,.1);
 if(drag.kind==='dry')state.mix.drywet=clamp((1-y/h)*100,0,100);
 if(drag.kind==='out')state.mix.output=clamp(-24+(1-y/h)*36,-24,12);
 renderControls();draw();scheduleProcess()});
graph.addEventListener('pointerup',e=>{drag={kind:null};try{graph.releasePointerCapture(e.pointerId)}catch{}});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('#playBtn').click()}});
renderControls();resize();
</script>
