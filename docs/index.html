const state={masterBypass:false,delta:false,solo:{band:-1,post:false},bandBypass:[false,false,false,false],eq:{bypass:false,globalBypass:false,freq:[80,350,2500,10000],gain:[0,0,0,0],q:[.707,.707,.707,.707],color:[35,35,35,35],colorBypass:[false,false,false,false],mode:[false,false,false,false]},dyn:{bypass:false,target:[18,18,18,18],dynamics:[0,0,0,0],attack:[8,8,5,3],release:[120,120,100,80],detectOnsets:[false,false,false,false],triggerBelow:[false,false,false,false],ms:[50,50,50,50],gainMid:[0,0,0,0],gainSide:[0,0,0,0]},ott:{bypass:false,bandBypass:[false,false,false,false],degree:[25,25,22,18],liftT:[-35,-35,-35,-35],liftA:[1,1,1,1],liftR:[80,80,80,80],liftM:[70,70,60,50],compT:[-24,-24,-24,-24],compA:[15,8,3,1],compR:[50,50,50,50],compM:[85,85,85,85],level:[0,0,0,0],x:[90,2500,7000],overlap:[50,50,50],input:0,gate:-80,mix:25,clip:false,output:0},type:{bypass:false,bandBypass:[false,false,false,false],degree:[6,12,28,22],level:[0,0,1,1],attack:1,release:20,input:0,mix:100,output:0},de:{bypass:false,freq:8000,intensity:3,mode:2,offset:0},mix:{bypass:false,drywet:100,output:0}};
const defaults=structuredClone(state),knobRefreshers=[],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=(v,d=1)=>Number(v).toFixed(d),logX=(hz,w)=>Math.log10(clamp(hz,20,20000)/20)/3*w,invLog=x=>20*Math.pow(1000,clamp(x,0,1));
// Active Web DSP source of truth: docs/vvchain-worklet.js · VVCHAIN v1.0.6
function makeWorkletUrl(){
  return new URL("vvchain-worklet.js",document.baseURI).href+"?v=1.0.5";
}
function switchToDirectAudioFallback(){
  if(directFallback||!source||!audioCtx)return;
  directFallback=true;
  try{source.disconnect(workletNode)}catch{}
  try{source.connect(audioCtx.destination)}catch{}
  $("#status").textContent="PLAYING · DIRECT AUDIO FALLBACK";
}
async function ensureAudioGraph(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(!audioCtx.audioWorklet)throw new Error("AudioWorklet unsupported");
  if(!workletNode){
    await audioCtx.audioWorklet.addModule(makeWorkletUrl());
    workletNode=new AudioWorkletNode(audioCtx,"vvchain-worklet",{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});
    workletFaulted=false;
    workletNode.onprocessorerror=()=>{
      const failedNode=workletNode;
      workletFaulted=true;
      workletNode=null;
      try{failedNode?.disconnect()}catch{}
      // Never stop the BufferSource here: keep playback alive and fail over
      // the already-running source to direct output.
      directFallback=true;
      if(source&&audioCtx){
        try{source.disconnect()}catch{}
        try{source.connect(audioCtx.destination)}catch{}
        $("#status").textContent="PLAYING · DIRECT AUDIO FALLBACK · processor error";
      }else{
        $("#status").textContent="DSP ERROR · AudioWorklet processor failed";
      }
    };
    workletNode.port.onmessageerror=()=>{
      const failedNode=workletNode;
      workletFaulted=true;
      workletNode=null;
      try{failedNode?.disconnect()}catch{}
      directFallback=true;
      if(source&&audioCtx){
        try{source.disconnect()}catch{}
        try{source.connect(audioCtx.destination)}catch{}
        $("#status").textContent="PLAYING · DIRECT AUDIO FALLBACK · message error";
      }
    };
    workletNode.port.onmessage=e=>{
      if(e.data?.type==="ready"){
        workletHeartbeatSeen=true;
        if(playing)$("#status").textContent="PLAYING · LOOP";
        return;
      }
      if(e.data?.type==="error"){
        const failedNode=workletNode;
        workletFaulted=true;
        workletNode=null;
        directFallback=true;
        try{failedNode?.disconnect()}catch{}
        if(source&&audioCtx){
          try{source.disconnect()}catch{}
          try{source.connect(audioCtx.destination)}catch{}
          $("#status").textContent="PLAYING · DIRECT AUDIO FALLBACK · "+(e.data.message||"worklet error");
        }else{
          $("#status").textContent="DSP ERROR · "+(e.data.message||"worklet error");
        }
        return;
      }
      if(e.data?.type==="dynMeters"){
        workletHeartbeatSeen=true;
        state.dyn.gainMid=Array.from(e.data.mid||[0,0,0,0]);
        state.dyn.gainSide=Array.from(e.data.side||[0,0,0,0]);
        drawEQ();
      }
    };
    workletNode.connect(audioCtx.destination);
    sendParams();
  }
}
let workletFaulted=false;
let paramSyncScheduled=false;
let paramSyncRevision=0;
function reconnectProcessingPath(){return false;}
function sendParams(){
  // Coalesce high-rate knob/graph events into one full-state transfer per UI frame.
  // This prevents a MessagePort backlog from starving the realtime render thread.
  if(!workletNode||directFallback||workletFaulted)return;
  if(paramSyncScheduled)return;
  paramSyncScheduled=true;
  const flush=()=>{
    paramSyncScheduled=false;
    if(!workletNode||directFallback||workletFaulted)return;
    try{
      paramSyncRevision++;
      workletNode.port.postMessage({
        type:"params",
        revision:paramSyncRevision,
        state:structuredClone(state)
      });
    }catch(err){
      workletFaulted=true;
      directFallback=true;
      if(source&&audioCtx){
        try{source.disconnect()}catch{}
        try{source.connect(audioCtx.destination)}catch{}
        $("#status").textContent="PLAYING · DIRECT AUDIO FALLBACK · parameter error";
      }else{
        $("#status").textContent="DSP PARAM ERROR · "+(err?.message||"clone/post failed");
      }
    }
  };
  if(typeof requestAnimationFrame==="function")requestAnimationFrame(flush);
  else setTimeout(flush,16);
}

    // Convert the pointer back to the node's grabbed anchor point first.
    // Comparing that corrected coordinate with the mouse-start X caused
    // an artificial first-frame jump and made the node run ahead.
    const nodeStartX=logX(dynFreqStartHz,w);
    const correctedX=x-dynFreqGrabOffsetX;
    const rawDx=correctedX-nodeStartX,rawDy=y-dynGainStartY;
    // Static EQ is a true XY control:
    // horizontal = Frequency, vertical = Gain.
    // Both axes remain active during the same drag.
    const effectiveDx=rawDx;
    const effectiveDy=rawDy;
    // Match logX()/invLog() exactly so the graph node follows the cursor.
    // 0.74 retains the requested slower feel without the previous overshoot.
    const startNorm=Math.log(Math.max(20,dynFreqStartHz)/20)/Math.log(1000);
    const followScale=0.74;
    const norm=clamp(startNorm+(effectiveDx/Math.max(1,w))*followScale*fine,0,1);
    const hzv=20*Math.pow(1000,norm);
    const deltaDb=-effectiveDy/Math.max(1,h)*36*fine;
    state.eq.freq[dragBand]=hzv;
    state.eq.gain[dragBand]=clamp(dynGainStartOffset+deltaDb,-18,18);
    setGraphControls(["EQ"+(dragBand+1)+"_FREQ","EQ"+(dragBand+1)+"_GAIN"],true);
    showGraphHint(e,graphHintBandHtml(dragBand,1|2));
    sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  if(dragMode===2&&dragBand>=0){
    const fine=e.shiftKey?0.1:1;
    const rawDx=x-dynTargetStartX,rawDy=y-dynDynamicsStartY;
    const startNorm=Math.log(Math.max(20,dynTargetStartFreq)/20)/Math.log(1000);
    const norm=clamp(startNorm+(rawDx/Math.max(1,w))*0.74*fine,0,1);
    const hzv=20*Math.pow(1000,norm);
    const deltaDynamics=-rawDy/Math.max(1,h)*200*fine;
    state.eq.freq[dragBand]=hzv;
    state.dyn.dynamics[dragBand]=clamp(dynDynamicsStartValue+deltaDynamics,-100,100);
    setGraphControls(["EQ"+(dragBand+1)+"_FREQ","DYN_DYNAMICS"+(dragBand+1)],true);
    showGraphHint(e,graphHintBandHtml(dragBand,1|4));
    sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  if(dragMode===6&&dragOverlapXover>=0){
    const fine=e.shiftKey?0.1:1;
    const next=clamp(overlapDragStartValue-(y-overlapDragStartY)/Math.max(1,h)*200*fine,0,100);
    state.ott.overlap[0]=state.ott.overlap[1]=state.ott.overlap[2]=next;
    setGraphControls(["XOVER_OVERLAP"],true);
    sendParams();drawEQ();return;
  }
  if(dragMode===4&&dragXover>=0){
    let f=invLog(x/w);
    if(dragXover===0)f=clamp(f,40,Math.min(1000,state.ott.x[1]-80));
    else if(dragXover===1)f=clamp(f,state.ott.x[0]+80,Math.min(5000,state.ott.x[2]-200));
    else f=clamp(f,state.ott.x[1]+200,18000);
    state.ott.x[dragXover]=f;setGraphControls(["OTT_X"+(dragXover+1)],true);sendParams();drawEQ();knobRefreshers.forEach(fn=>fn());return;
  }
  drawEQ();
});
eqCanvas.addEventListener("pointerup",e=>{
  const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,h=r.height;
  const hit=graphHoverTarget(x,y,w,h);
  if(hit.band>=0)showGraphHint(e,graphHintBandHtml(hit.band,hit.mask));else hideGraphHint();
  dragMode=0;dragBand=-1;dragXover=-1;dragOverlapXover=-1;dragDynamicMsBand=-1;dragDynamicTargetBand=-1;dragDynamicHandleBand=-1;eqDragAxis=0;clearGraphControls();drawEQ();
});
eqCanvas.addEventListener("pointercancel",e=>{
  const r=eqCanvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,h=r.height;
  const hit=graphHoverTarget(x,y,w,h);
  if(hit.band>=0)showGraphHint(e,graphHintBandHtml(hit.band,hit.mask));else hideGraphHint();
  dragMode=0;dragBand=-1;dragXover=-1;dragOverlapXover=-1;dragDynamicMsBand=-1;dragDynamicTargetBand=-1;dragDynamicHandleBand=-1;eqDragAxis=0;clearGraphControls();drawEQ();
});
function stopPlayback(){if(source){try{source.stop()}catch{}try{source.disconnect()}catch{}source=null}playing=false;$("#status").textContent="READY"}
async function loadAudioFile(file){if(!file)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();$("#status").textContent="DECODING…";audioBuffer=await audioCtx.decodeAudioData(await file.arrayBuffer());$("#fileName").textContent=file.name;$("#status").textContent="READY"}catch(e){$("#status").textContent="LOAD ERROR"}}
async function startPlayback(){
  if(!audioBuffer){$("#status").textContent="先 LOAD AUDIO";return}
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  stopPlayback();
  directFallback=false;
  workletFaulted=false;
  workletHeartbeatSeen=false;
  paramSyncScheduled=false;
  try{await ensureAudioGraph()}catch(err){
    directFallback=false;
    workletFaulted=true;
    $("#status").textContent="DSP ERROR · "+(err?.message||"AudioWorklet unavailable");
    return;
  }
  source=audioCtx.createBufferSource();
  source.buffer=audioBuffer;
  source.loop=true;
  source.connect(directFallback?audioCtx.destination:workletNode);
  source.onended=()=>{if(playing){source=null;return}playing=false;$("#status").textContent="READY"};
  source.start();playing=true;$("#status").textContent="PLAYING · LOOP";
  // Give the worklet enough time to publish its ready heartbeat before any
  // compatibility fallback. A transient startup delay must never disable DSP.
  setTimeout(()=>{
    if(playing&&!workletHeartbeatSeen&&!directFallback&&!workletFaulted){
      switchToDirectAudioFallback();
    }
  },3500);
}
$("#audioFileInput").addEventListener("change",e=>loadAudioFile(e.target.files[0]));$("#playBtn").onclick=()=>startPlayback().catch(()=>$("#status").textContent="PLAY ERROR");$("#stopBtn").onclick=stopPlayback;$("#resetBtn").onclick=()=>location.reload();
</script>
