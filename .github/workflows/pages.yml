name: Deploy VVChain Web Preview

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "assets/ui/runtime/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vvchain-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout docs only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            docs
            assets/ui/runtime
          sparse-checkout-cone-mode: true

      - name: Stage approved Master runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/assets/ui/runtime
          if [ -f assets/ui/runtime/APPROVED.lock ]; then
            mkdir -p docs/assets/ui
            cp -a assets/ui/runtime docs/assets/ui/runtime
            test -f docs/assets/ui/runtime/APPROVED.lock
            echo "Master runtime staged from the repository source assets."
          else
            echo "APPROVED.lock absent: deploy the existing Candidate runtime only."
          fi

      - name: Fast Web validation
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/vvchain-worklet.js
          test -s docs/assets/ui/png/ivory_knob_strip.png
          test -s docs/assets/ui/png/studio_knob_strip.png
          test -s docs/assets/ui/png/muted_knob_strip.png
          test -s docs/assets/ui/png/ivory_button_on.png
          test -s docs/assets/ui/png/bypass_led_red.png
          test -s docs/assets/ui/png/ivory_module.png
          test -s docs/assets/ui/png/studio_module.png
          test -s docs/assets/ui/png/muted_module.png
          test -s docs/assets/ui/png/ivory_graph.png
          test -s docs/assets/ui/png/studio_graph.png
          test -s docs/assets/ui/png/muted_graph.png
          test -s docs/assets/ui/png/ivory_slider_track.png
          test -s docs/assets/ui/png/ivory_slider_thumb.png
          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path("docs/assets/ui/png")
          expected = {
              "ivory_panel.png": (1500, 930),
              "studio_panel.png": (1500, 930),
              "muted_panel.png": (1500, 930),
              "ivory_module.png": (600, 930),
              "studio_module.png": (600, 930),
              "muted_module.png": (600, 930),
              "ivory_graph.png": (1500, 330),
              "studio_graph.png": (1500, 330),
              "muted_graph.png": (1500, 330),
              "ivory_knob_strip.png": (1024, 1024),
              "studio_knob_strip.png": (1024, 1024),
              "muted_knob_strip.png": (1024, 1024),
              "ivory_button_off.png": (360, 120),
              "ivory_button_on.png": (360, 120),
              "ivory_button_pressed.png": (360, 120),
              "button_disabled.png": (360, 120),
              "ivory_led_on.png": (128, 128),
              "ivory_led_off.png": (128, 128),
              "bypass_led_red.png": (128, 128),
              "ivory_screw.png": (96, 96),
              "ivory_slider_track.png": (800, 120),
              "ivory_slider_thumb.png": (120, 120),
          }
          sig = b"\x89PNG\r\n\x1a\n"
          for name, size in expected.items():
              data = (root / name).read_bytes()
              assert data[:8] == sig, name
              assert struct.unpack(">II", data[16:24]) == size, (name, size)
              # PNG IHDR colour type 6 = truecolour with alpha (RGBA).
              assert data[25] == 6, (name, "not RGBA", data[25])
          print("Pages engineering PNG contract: PASS")
          PY
          grep -q 'id="bandGrid"' docs/index.html
          grep -q 'TRANSIENT' docs/index.html
          grep -q 'ANALOG COLOR' docs/index.html
          node --check docs/vvchain-worklet.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('docs/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('ERROR: no inline JavaScript found')
          Path('/tmp/vvchain-pages.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/vvchain-pages.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('docs/index.html').read_text(encoding='utf-8')
          shown = re.search(r'VVCHAIN v(\d+\.\d+\.\d+)', html)
          cache = re.search(r'vvchain-worklet\.js",document\.baseURI\)\.href\+"\?v=(\d+\.\d+\.\d+)"', html)
          if not shown or not cache or shown.group(1) != cache.group(1):
              raise SystemExit('ERROR: Web visible version and AudioWorklet cache version differ')
          print('Web version/cache parity: PASS')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
