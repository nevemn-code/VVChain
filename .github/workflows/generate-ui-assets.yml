name: Generate UI Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Tools/generate_ui_assets.py"
      - ".github/workflows/generate-ui-assets.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install renderer dependencies
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: Generate PNG assets
        run: python3 Tools/generate_ui_assets.py

      - name: Validate asset contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("docs/assets/ui/png")
          panel = Image.open(root / "backgrounds/panel_bg.png")
          knob = Image.open(root / "knobs/knob_sprite_64.png")

          assert panel.size == (1500, 930), panel.size
          assert panel.mode in ("RGB", "RGBA"), panel.mode
          assert knob.size == (1536, 1536), knob.size
          assert knob.mode == "RGBA", knob.mode

          component_dirs = [
              root / "components/buttons",
              root / "components/leds",
              root / "components/sliders",
              root / "components/screws",
          ]

          count = 0
          for folder in component_dirs:
              files = sorted(folder.glob("*.png"))
              assert files, f"No PNGs generated in {folder}"
              for p in files:
                  im = Image.open(p)
                  assert im.mode == "RGBA", f"{p}: {im.mode}"
                  assert "A" in im.getbands(), f"{p}: missing alpha"
                  count += 1

          assert count >= 40, count
          print(f"Validated panel + 64-frame knob sprite + {count} isolated RGBA components.")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/ui/png/backgrounds                   docs/assets/ui/png/knobs                   docs/assets/ui/png/components                   docs/assets/ui/png/ASSET_INDEX.md                   docs/assets/ui/png/asset_manifest.json
          if git diff --cached --quiet; then
            echo "Assets already up to date."
          else
            git commit -m "assets: generate obsidian industrial purple UI PNG set [skip ci]"
            git push
          fi
