name: VVChain CI/CD

on:
  push:
    branches: [ "main", "fix/*", "analog-lab/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup CMake and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libasound2-dev libjack-jackd2-dev           libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libx11-dev libxi-dev libxcomposite-dev           libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

    - name: Configure CMake (Strict Release & AVX2)
      run: |
        cmake -B build -G Ninja           -DCMAKE_BUILD_TYPE=Release           -DCMAKE_CXX_FLAGS="-O3 -ffast-math -mavx2 -D JUCE_WEB_BROWSER=0 -D JUCE_USE_CURL=0 -D JUCE_HEADLESS_PLUGIN_CLIENT=1"

    - name: Build DSP Core and Tests
      run: cmake --build build --config Release --parallel 4

    - name: Run Python Stress Tests (Optimized PRBS Matrix)
      run: |
        python3 -m pip install numpy scipy
        python3 Tests/reference_stress.py
        python3 Tests/analog_matrix.py
