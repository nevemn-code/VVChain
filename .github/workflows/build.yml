name: VVChain build
# CI verification trigger: build the current PR head after compiler fixes.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Reference stress test
        shell: pwsh
        run: python Tests/reference_stress.py

      - name: Web Preview smoke test
        shell: pwsh
        run: python Tests/web_smoke.py

      - name: Configure
        shell: pwsh
        run: cmake -S . -B Builds -G "Visual Studio 18 2026" -A x64 -DVVCHAIN_ENABLE_AAX=OFF -DVVCHAIN_BUILD_STANDALONE=ON

      - name: Build
        shell: pwsh
        run: cmake --build Builds --config Release

      - name: Real audio latency / phase probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem -Path "$PWD\Builds" -Recurse -File -Filter "VVChainAudioProbe.exe" |
            Select-Object -First 1

          if (-not $probe) {
            Write-Host "VVChainAudioProbe.exe not found."
            Get-ChildItem -Path "$PWD\Builds" -Recurse | Select-Object FullName
            exit 1
          }

          # Each probe execution contains 10 rounds x 50 cases = 500
          # independent audio-domain cases. Repeat the complete 500-case
          # suite 10 times for final confirmation (5,000 audio cases total).
          for ($pass = 1; $pass -le 10; $pass++) {
            Write-Host "=== Audio verification pass $pass / 10 ==="
            & $probe.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Audio verification failed on pass $pass."
              exit $LASTEXITCODE
            }

            $report = Join-Path $PWD "VVChain_audio_probe.csv"
            if (-not (Test-Path $report)) {
              Write-Host "Audio probe CSV was not produced on pass $pass."
              exit 1
            }

            $passName = "VVChain_audio_probe_pass_{0:D2}.csv" -f $pass
            Copy-Item -LiteralPath $report -Destination (Join-Path $PWD $passName) -Force
          }

          Copy-Item -LiteralPath "$PWD\VVChain_audio_probe_pass_10.csv" -Destination "$PWD\VVChain_audio_probe.csv" -Force

      - name: Collect VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path "$PWD\Builds" -Recurse -Directory -Filter "VVChain.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Write-Host "VVChain.vst3 not found."
            Get-ChildItem -Path "$PWD\Builds" -Recurse | Select-Object FullName
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "$PWD\Artifacts" | Out-Null
          Copy-Item -LiteralPath $vst3.FullName -Destination "$PWD\Artifacts\VVChain.vst3" -Recurse -Force

          $probeReports = Get-ChildItem -Path $PWD -File -Filter "VVChain_audio_probe_pass_*.csv"
          if (-not $probeReports) {
            Write-Host "Audio probe pass CSVs were not produced."
            exit 1
          }

          Copy-Item -LiteralPath $probeReports.FullName -Destination "$PWD\Artifacts" -Force

          $probeReport = Join-Path $PWD "VVChain_audio_probe.csv"
          if (Test-Path $probeReport) {
            Copy-Item -LiteralPath $probeReport -Destination "$PWD\Artifacts\VVChain_audio_probe.csv" -Force
          } else {
            Write-Host "Final audio probe CSV was not produced."
            exit 1
          }

          $readme = @"
          VVChain Windows x64 VST3 test build

          1. Extract VVChain.vst3 from this artifact.
          2. Keep the entire VVChain.vst3 folder intact.
          3. Load the plugin from SAVIHost or copy it to a VST3 folder.
          4. This is a VST3 bundle; the actual plugin binary is inside the bundle.
          "@
          Set-Content -Path "$PWD\Artifacts\README.txt" -Value $readme -Encoding UTF8

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVChain-VST3-Windows-x64
          path: Artifacts
          if-no-files-found: error
          compression-level: 0
